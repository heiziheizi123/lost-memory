<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CODE SELA - 车祸现场男孩失踪案</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(circle at 10% 20%,#1a1a2e,#090909 80%);color:#ddd;font:14px/1.65 'Segoe UI','Microsoft YaHei',sans-serif}.wrap{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 350px;gap:18px}.main,.side{display:flex;flex-direction:column;gap:16px}.panel,#box,#restore{background:#111;border:1px solid #333;border-radius:7px;padding:15px}#out{height:500px;overflow:auto}.record{margin:12px 0;padding:12px;background:#1a1a1a;border-left:3px solid #4cd1a3}.sela{color:#4cd1a3;font-weight:bold}b,h2{color:#e0b354}.small{color:#888;font-size:12px}.row,.items{display:flex;gap:8px;flex-wrap:wrap}button,input,select{background:#292929;color:#ddd;border:1px solid #444;border-radius:4px;padding:9px}button{cursor:pointer}button:hover{border-color:#e0b354}.cmd{width:100%}.chip{padding:8px;border:1px solid #444;background:#1b1b1b;border-radius:5px;color:#e0b354;cursor:pointer}.term{color:#6ab0e3}.place{color:#4cd1a3}#box,#restore,#videoPanel{display:none}.restore-card{margin:10px 0;padding:12px;border:1px solid #444;background:#191919}.restore-card.done{border-color:#2d5c2d;background:#14251b}.blank{display:inline-block;margin:2px 3px;min-width:115px;border:1px dashed #6ab0e3;padding:4px 6px;color:#6ab0e3;background:#111}.blank select{width:100%;padding:4px}.video{width:100%}@media(max-width:900px){.wrap{grid-template-columns:1fr}#out{height:430px}.chip{flex:1}}</style><body><div class="wrap"><main class="main"><div id="out" class="panel"></div><div class="panel"><h2>资料检索</h2><div class="small">人物编号/地点编号，例如 A/R。未登记编号无法检索。</div><input id="cmd" class="cmd" placeholder="输入人物编号/地点编号"><div class="row"><button onclick="run()">检索资料</button><button onclick="hint()">请求 SELA 提示</button><button onclick="toggle('box')">调查面板</button><button onclick="toggle('restore')">案件推演</button></div></div><div id="box"><h2>调查面板</h2><div id="selected"></div><div class="small">最多3项。放入顺序不影响分析结果。</div><div class="row"><button onclick="combine()">调查资料</button><button onclick="st.sel=[];render()">清空</button></div></div><div id="restore"><h2>案件推演</h2><p class="small">使用已经发现的词条补全推演。词条顺序由句子决定；资料调查顺序不影响组合。</p><div id="restoreBody"></div></div></main><aside class="side"><div class="panel"><h2>人物档案</h2><div id="people" class="items"></div></div><div class="panel"><h2>地点记录</h2><div id="places" class="items"></div></div><div class="panel"><h2>物品栏</h2><div id="items" class="items"></div></div><div class="panel"><h2>已发现词条</h2><div id="terms" class="items"></div></div><div class="panel"><h2>案件概要</h2>委托人：周夫妇<br>失踪者：周扬名，男，3岁<p class="small">雨夜出了车祸。周夫妇被送去医院，等警方重新核对车里的人时，原本坐在后排的孩子不见了。</p></div><div class="panel" id="videoPanel"><h2>寻人启事录像</h2><video id="missingVideo" class="video" controls src="missing-boy.MP4"></video></div></aside></div><script>const P={A:'周夫妇｜委托人',B:'侦探｜你',C:'陈国安｜警官',D:'林淑琴｜关联人物',E:'赵志强｜货车司机',F:'孙丽华｜急救护士',G:'吴建民｜店主',H:'郑凯｜出租车司机',I:'罗春梅｜居民',J:'周扬名｜失踪男童'},L={R:'Road｜青禾路',A:'Apartment｜周家',H:'Hospital｜市二院',B:'Bridge｜东渠桥',S:'Store｜建民小卖部',T:'Taxi Stand｜旧客运站',P:'Police｜城南派出所',G:'Gas Station｜南环加油站'};let st={p:new Set(['A','B','C']),l:new Set(['R','A']),t:new Set(),seen:new Set(),items:new Set(['事故现场照片','周扬名寻人启事']),sel:[],rest:new Set(),comb:new Set()};const O=document.getElementById('out');function log(x){O.insertAdjacentHTML('beforeend',`<div>${x}</div>`);O.scrollTop=O.scrollHeight}function sela(x){log(`<span class=sela>SELA：</span>${x}`)}function rec(t,x){return `<div class=record><b>${t}</b><br>${x}</div>`}function term(x){if(!st.t.has(x)){st.t.add(x);if(x==='公开寻人时间'){videoPanel.style.display='block';sela('检测到可关联公开资料。读取入口已建立。')}render()}}function item(x,m=''){if(!st.items.has(x)){st.items.add(x);log(`获得资料：<b>${x}</b>`);if(m)sela(m);render()}}function up(x,m='检测到新人物记录。已建立检索入口。'){if(!st.p.has(x)){st.p.add(x);sela(m);render()}}function ul(x,m='检测到新地点记录。已加入可检索范围。'){if(!st.l.has(x)){st.l.add(x);sela(m);render()}}const R={'A/A':()=>{item('蓝色玩具汽车');term('后排右座');return rec('周家｜再次询问','周明远：“他一直坐后排右边。出门的时候还在找那辆蓝色小汽车。”<br>周母：“最后记得最清楚的反而就是这些小事。”')},'A/R':()=>{up('F');ul('H');term('儿童哭声');return rec('青禾路｜周明远','“撞完以后我醒过一下。我听见扬名哭了一声，像是在喊我。后面还有谁，我真记不起来了。”')},'C/R':()=>{up('E');item('现场警戒记录');term('外围未封闭');return rec('青禾路｜陈国安','“我们到的时候急救已经在忙，警戒带只拉了一半，桥东那侧还有路人进出。后排右门是开的。当年大家都以为孩子自己跑了，但没人亲眼看见。”')},'C/P':()=>{item('首次搜寻范围图');term('首轮仅搜事故点周边');return rec('城南派出所｜陈国安','“第一轮只沿事故点、桥下和附近草坡找。到22:06左右医院才确认车里原本还有个三岁孩子。那时我们仍按孩子自己走失在搜，没有查离开的车辆。”')},'F/H':()=>{item('急救出车单');term('伤员优先转运');return rec('市二院｜孙丽华','“两个大人伤得重，我们先做固定、止血和转运。我问过一句孩子谁看着，旁边有人回家里人抱着。我当时没有停下来核对那个人是谁。”')},'F/R':()=>{term('儿童哭声');return rec('青禾路｜孙丽华','“小孩哭声我听见过，就一下。后排那边好几个人，我没看清是谁把孩子抱起来的。”')},'E/R':()=>{ul('B');term('灰色外套');return rec('青禾路｜赵志强','“后门边有个穿灰外套的女的。我当时真以为她是家里人。脸没看清，雨太大。”')},'E/B':()=>{up('I');return rec('东渠桥｜赵志强','“罗春梅那晚一直说，她看见有人抱着小孩往桥东走。我当时还觉得她看错了。”')},'I/B':()=>{up('G');ul('S');term('抱离');return rec('东渠桥｜罗春梅','“我没看清脸。我就看见一个灰衣女的抱着孩子往桥东走。孩子头靠她肩上，不像自己在走。”')},'G/S':()=>{up('H');ul('T');item('小卖部赊账纸');term('红色塑料袋');return rec('建民小卖部｜吴建民','“九点多，一个女的抱着男孩进来，买了毛巾和水。后来老郑的出租车停门口。我当时没觉得不对。”')},'H/T':()=>{item('出租车调度抄件');term('现金短途单未登记');return rec('旧客运站｜残存调度记录','调度：“桥边那个女的？”<br>郑凯：“嗯。”<br>调度：“林姐？”<br>郑凯：“你别乱说，我没说名字。”')},'G/B':()=>{term('侧脸疑似林淑琴');return rec('东渠桥｜补充询问','吴建民：“那个女的侧脸有点像林淑琴。只能说像，隔这么多年我哪敢说死。”')},'H/S':()=>{term('出租车前往南环');return rec('建民小卖部｜郑凯','“那晚我是拉过一个抱孩子的女的。她说去南环，给现金。小孩靠着她，像睡着了。短单我嫌麻烦，没登记。”')},'D/T':()=>{ul('G');item('异常里程记录');term('纸边出现林淑琴缩写');return rec('旧客运站｜旧纸本','纸边有很潦草的“林淑琴”缩写。郑凯车辆21:40—22:10多了约8公里，这段没有乘客登记。')},'D/G':()=>{item('加油站旧账页');term('白色面包车');return rec('南环加油站｜旧账旁注','“一女带一小孩借电话，后上一辆白色面包车。”车牌没记全。下面还有一行：“小孩一直没醒？”')},'J/R':()=>{term('事故后仍有哭声');return rec('周扬名｜现场记录整理','家属确认周扬名坐在后排右侧；事故后周明远与急救护士都分别听到儿童哭声。现有记录至少能确认：撞击之后，孩子仍有生命反应。')}};function after(){if(['A/A','A/R','F/R'].every(x=>st.seen.has(x)))up('J','多项记录可对应同一儿童身份。已建立独立人物档案。');if(['H/T','G/B'].every(x=>st.seen.has(x)))up('D','检测到重复身份信息。对应关系尚未确认，已开放检索。');if(['C/R','F/H'].every(x=>st.seen.has(x)))ul('P','检测到现场处置与身份确认之间存在时间缺口。已开放相关记录。')}function run(){let q=cmd.value.trim().toUpperCase();cmd.value='';let z=q.split('/');if(z.length!==2)return sela('输入格式无法解析。');if(!st.p.has(z[0])||!st.l.has(z[1]))return sela('指定索引尚未登记。');if(!R[q])return sela('未检测到该索引组合的可读取记录。');let old=st.seen.has(q);st.seen.add(q);log(R[q]());if(old)sela('该记录已读取。未产生新增信息。');after();renderRestore()}function pick(x){if(st.sel.includes(x))st.sel=st.sel.filter(v=>v!==x);else if(st.sel.length<3)st.sel.push(x);else return sela('调查面板容量已满。');render()}function k(){return [...st.sel].sort().join('|')}const C={};function combo(a,f){C[[...a].sort().join('|')]=f}combo(['事故现场照片','现场警戒记录'],()=>{term('后排车门');item('后排儿童鞋印照片');return'后排右门曾打开，门外存在儿童鞋印。'});combo(['急救出车单','现场警戒记录','周扬名寻人启事'],()=>{term('接走者身份未核实');return'急救记录与警戒记录都没有留下接走孩子者的身份核验。'});combo(['后排儿童鞋印照片','蓝色玩具汽车'],()=>{term('儿童曾离车');return'儿童曾从后排右侧离开车厢。'});combo(['出租车调度抄件','小卖部赊账纸'],()=>{term('离店与上车时间衔接');return'小卖部购买时间与未登记短途单的发车时间前后衔接。'});combo(['出租车调度抄件','异常里程记录'],()=>{term('里程与南环相符');return'未登记时段增加的里程与前往南环的路线长度接近。'});combo(['加油站旧账页','异常里程记录','周扬名寻人启事'],()=>{term('再次上车');return'加油站旁注中的一女一童出现在前段行程之后，并记录二人随后登上一辆白色面包车。'});combo(['出租车调度抄件','异常里程记录','首次搜寻范围图'],()=>{term('搜寻开始前已离开范围');return'首次搜寻只覆盖事故点周边，而车辆在正式确认失踪前已经驶向更远区域。'});combo(['周扬名寻人启事','首次搜寻范围图'],()=>{term('公开寻人时间');return'检测到时间节点关联。'});function combine(){if(st.sel.length<2)return sela('资料数量不足。');let x=k(),f=C[x];if(!f)return sela('当前资料组合未形成稳定关联。');if(st.comb.has(x))return sela('该组合已分析。结论无变化。');st.comb.add(x);sela('<b>交叉分析完成</b><br>'+f());st.sel=[];render();renderRestore()}const RS=[{id:'r1',n:'推演01｜事故前周扬名坐在哪里',need:['A/A','A/R','F/R'],s:'家属确认周扬名坐在{0}；事故后现场又留下{1}。两份独立口述都指向后排儿童。',a:['后排右座','儿童哭声'],end:'事故前后记录中的后排儿童可以对应到周扬名。'},{id:'r2',n:'推演02｜撞击是不是最后记录',need:['J/R'],s:'两名不同来源的证人都提到撞击后的儿童声音，因此可以确认{0}。',a:['事故后仍有哭声'],end:'撞击之后仍有儿童哭声，事故本身不是周扬名记录的终点。'},{id:'r3',n:'推演03｜孩子是否离开过车厢',need:['C/R'],s:'警戒记录显示{0}；现场照片与随身物品进一步支持{1}。这只能证明孩子离开过车厢，不能证明他独自走远。',a:['后排车门','儿童曾离车'],end:'孩子确实离开过后排右侧，但离开现场的方式仍不明确。'},{id:'r4',n:'推演04｜谁确认了孩子被谁带走',need:['C/R','F/H','E/R'],s:'救援开始时{0}，急救人员以{1}为先；现有记录中，最终没有留下{2}。',a:['外围未封闭','伤员优先转运','接走者身份未核实'],end:'有人默认抱孩子的是家属，但没有任何一方真正完成身份核实。'},{id:'r5',n:'推演05｜孩子是自己走到桥东的吗',need:['E/B','I/B','G/S'],s:'事故点有人见到{0}女性；桥东目击则明确记录孩子被{1}。两段口述的移动方向能够接上。',a:['灰色外套','抱离'],end:'孩子不是独自步行到桥东；目击显示有人抱着他离开事故区域。'},{id:'r6',n:'推演06｜小卖部以后去了哪里',need:['G/S','H/T','H/S'],s:'调度记录留下了一笔{0}；司机回忆该车{1}，而赊账时间与发车时间形成{2}。',a:['现金短途单未登记','出租车前往南环','离店与上车时间衔接'],end:'小卖部的一女一童与未登记出租车行程在时间和地点上连续。'},{id:'r7',n:'推演07｜“林姐”能否确认身份',need:['H/T','G/B','D/T'],s:'目击者只能提供{0}，旧纸本则留下{1}。两条记录互相指向，但都不足以单独完成身份确认。',a:['侧脸疑似林淑琴','纸边出现林淑琴缩写'],end:'“林姐”与林淑琴存在两处独立关联，但现有材料仍不足以确认抱走孩子的人就是她。'},{id:'r8',n:'推演08｜警方为什么一直没找到',need:['C/P','H/S'],s:'警方最初{0}；与此同时，出租车的{1}，因此正式确认失踪时，孩子可能已经{2}。',a:['首轮仅搜事故点周边','里程与南环相符','搜寻开始前已离开范围'],end:'警方按步行走失划定搜索圈时，一条车辆路线已经把目标带出该范围。'},{id:'r9',n:'推演09｜南环之后还有一辆车吗',need:['D/G'],s:'加油站旁注明确写到{0}；结合到达时间，可以确认一女一童在南环{1}。',a:['白色面包车','再次上车'],end:'南环不是现有记录的终点：一女一童又登上另一辆车，此后记录中断。'},{id:'r10',n:'最终推演｜周扬名去了哪里',need:['D/G','J/R'],s:'周扬名在事故后{0}；救援现场{1}，随后有人将他{2}。小卖部之后的记录支持{3}，南环最后出现了{4}。',a:['事故后仍有哭声','接走者身份未核实','抱离','出租车前往南环','白色面包车'],end:'可验证路线止于南环出现的白色面包车；之后去向未知。'}];function ready(r){return r.need.every(x=>st.seen.has(x))&&r.a.every(x=>st.t.has(x))}function sentence(r){let s=r.s;return s.replace(/\{(\d+)\}/g,(_,i)=>`<span class=blank><select id="${r.id}_${i}"><option value="">选择词条</option>${[...st.t].map(t=>`<option>${t}</option>`).join('')}</select></span>`)}function submitR(id){let r=RS.find(x=>x.id===id);if(!ready(r))return sela('推演输入不足。');let ok=r.a.every((x,i)=>document.getElementById(`${id}_${i}`).value===x);if(!ok)return sela('词条排列无法形成稳定推演。请重新比对句意。');st.rest.add(id);log(rec(r.n+'｜推演成立',r.end));if(id==='r10')sela('推演结束。现有数据无法继续延伸路线。');renderRestore()}function renderRestore(){restoreBody.innerHTML=RS.map(r=>`<div class="restore-card ${st.rest.has(r.id)?'done':''}"><b>${r.n}</b>${st.rest.has(r.id)?`<p>${r.end}</p>`:ready(r)?`<p>${sentence(r)}</p><button onclick="submitR('${r.id}')">提交推演</button>`:'<p class=small>当前资料不足，无法建立完整语句。</p>'}</div>`).join('')+(RS.every(r=>st.rest.has(r.id))?'<div class="restore-card done"><b>SELA：案件模型已完成</b><p>现有资料已完成整合。</p><button onclick="finish()">生成最终案件报告</button></div>':'')}function finish(){localStorage.setItem('lost_memory_complete','1');location.href='ending.html'}function hint(){let r=RS.find(x=>!st.rest.has(x.id));if(r){let miss=r.a.filter(x=>!st.t.has(x));if(miss.length){let h={r4:'重新看现场警戒记录和急救出车单。警察关心的是现场边界，急救人员关心的是重伤员。两边都提到了孩子，却没有一份记录写清楚：抱走孩子的人究竟由谁核实过身份。再想想哪份公开资料能证明警方后来才正式确认孩子失踪。',r6:'先不要纠结抱孩子的女人到底是谁。把小卖部留下的时间、出租车调度记录和司机对目的地的回忆放在一起看。关键不是长相，而是“她什么时候离开小卖部”和“那辆没有正常登记的车什么时候出发”。',r8:'把警方第一轮搜索范围当成一张静止的地图，再把出租车的里程当成一条移动的线。警方什么时候才确认三岁孩子失踪？在那个时间点之前，那辆车理论上已经能走到哪里？',r9:'南环不是只出现了一个模糊的人影。仔细读加油站旧账旁注：女人和孩子到达以后，还发生了一个明确的“上车”动作。再用异常里程记录确认它是不是接在上一段行程之后。',r10:'最终推演不要再猜“林姐是谁”。只留下能被现有记录直接支持的动作，并按时间排序：事故后是否仍有哭声、现场有没有人核实接走者、孩子如何离开、出租车去了哪个方向、南环最后出现了什么车辆。'};return sela(h[r.id]||'当前推演缺少关键词条。先检查它要求的事实属于证词、纸本时间还是资料交叉结果；已登记的人物和地点中仍可能有未读记录。')}return sela('这段推演所需事实已经齐全。不要寻找新证据，重新读句子的主语和时间顺序，再排列现有词条。')}let c=Object.keys(C).find(x=>!st.comb.has(x)&&x.split('|').every(y=>st.items.has(y)));if(c)return sela('你手里的资料已经能形成新的交叉关系。把描述同一时间段、同一路线或同一现场处置的记录放进调查面板，不要只比较人物姓名。');if(Object.keys(R).some(q=>!st.seen.has(q)&&st.p.has(q[0])&&st.l.has(q[2])))return sela('当前已登记的人物与地点之间还有记录没有读取。优先回看最近由证词新解锁的人物或地点。');sela('当前信息增量较低。检查尚未完成的推演，判断缺的是现场处置、时间衔接、路线还是车辆记录。')}function toggle(id){let e=document.getElementById(id);e.style.display=e.style.display==='block'?'none':'block'}function render(){people.innerHTML=[...st.p].map(x=>`<div class=chip>${x}<br><span class=small>${P[x]}</span></div>`).join('');places.innerHTML=[...st.l].map(x=>`<div class="chip place">${x}<br><span class=small>${L[x]}</span></div>`).join('');items.innerHTML=[...st.items].map(x=>`<div class=chip onclick="pick('${x}')">${x}</div>`).join('');terms.innerHTML=[...st.t].map(x=>`<div class="chip term">${x}</div>`).join('')||'<span class=small>尚未发现词条</span>';selected.innerHTML=st.sel.map(x=>`<button onclick="pick('${x}')">${x}</button>`).join(' ')||'<span class=small>未放入资料</span>'}cmd.addEventListener('keydown',e=>e.key==='Enter'&&run());missingVideo.addEventListener('ended',()=>item('寻人启事录像记录','录像读取完成。公开资料已归档。'));render();renderRestore();sela('连接完成。SELA 私人调查辅助系统已启动。');sela('人物、地点、证词与物证索引已载入。');log(rec('新的委托','周夫妇想重新查一遍儿子周扬名当年的失踪。那场车祸以后，两个人被送去了医院，孩子却没找到。<br><br>这次只查一件事：<b>事故以后，他去了哪里？</b>'));sela('当前可检索人物：A、B、C。当前可检索地点：R、A。');</script><script src="save-system.js"></script></body></html>
