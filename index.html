<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>周扬名失踪案</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Microsoft YaHei',sans-serif;font-weight:600}body{background:#071426;color:#edf4ff;line-height:1.65;padding:20px;background-image:radial-gradient(circle at 12% 15%,#17345c 0%,#0b203b 35%,#061324 100%);min-height:100vh}.container{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 350px;gap:20px}.game-area{display:grid;grid-template-rows:auto auto auto;gap:20px}#output{border:1px solid #31537c;padding:20px;height:500px;overflow-y:auto;background:#0b1b31;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.35)}.toolbox{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}button,input{padding:10px 15px;background:#142a47;color:#edf4ff;border:1px solid #3b5e88;border-radius:4px;font-weight:700}button{cursor:pointer;transition:.25s}button:hover{background:#1c3b64;border-color:#80b8ef}.search-input{width:100%;background:#0d213b}.sidebar{display:flex;flex-direction:column;gap:20px}.panel{border:1px solid #31537c;padding:15px;background:#0b1b31;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3)}.panel h2,#examine-box h2,#restore-panel h2{color:#f0c66d;margin-bottom:15px;padding-bottom:8px;border-bottom:1px solid #31537c;font-size:1.3rem;font-weight:800}.item-wrap{display:flex;flex-wrap:wrap;gap:10px}.item-box{color:#f0c66d;cursor:pointer;padding:10px;border:1px solid #36577e;border-radius:6px;background:#10243e;transition:.25s;min-width:105px;text-align:center;font-weight:700}.item-box:hover{border-color:#f0c66d;background:#183454;transform:translateY(-2px)}.term-box{color:#9ed2ff;border-color:#396b99;background:#102a49}.person-box{color:#f0c66d}.place-box{color:#7ee5c1;border-color:#347765}.sela{color:#72e2bd;font-weight:800}.system{color:#ffb083;font-style:italic}.new{color:#91cfff;font-weight:700}.record{margin:13px 0;padding:12px;border-left:3px solid #72e2bd;background:#10243e}.record b{color:#f0c66d;font-weight:800}.chat-message{margin:8px 0;padding:8px;border-left:3px solid #72e2bd;background:#142a47}.chat-sender{color:#f0c66d;font-weight:800}#examine-box{display:none;border:2px solid #b45b67;padding:15px;background:#261727;border-radius:8px;min-height:150px}#box-content{display:flex;flex-wrap:wrap;gap:10px;min-height:50px;align-items:center}.empty-box{color:#71829a;font-style:italic}.item-in-box{color:#f0c66d;padding:10px;border:1px solid #496482;border-radius:6px;background:#18304e;cursor:pointer}.box-counter,.small{color:#aabbd0;font-size:.9rem}.action-btn{background:#245884;border-color:#4b89bb}.restore-card{padding:13px;margin:10px 0;border:1px solid #36577e;border-radius:6px;background:#10243e}.restore-card.done{border-color:#347765;background:#102f2d}.restore-card b{color:#f0c66d}.submit-btn{background:#27674f}.case-note{margin:10px 0;color:#d1dced}.video{width:100%;border:1px solid #31537c;background:#000}#restore-panel{display:none;padding:15px;border:1px solid #31537c;border-radius:6px;background:#0b1b31}@media(max-width:900px){body{padding:10px}.container{grid-template-columns:1fr}#output{height:430px}.item-box{min-width:90px;flex:1}}</style></head><body><div class="container"><main class="game-area"><div id="output"></div><div class="panel"><h2>资料检索</h2><div class="small">检索格式：人物编号/地点编号，例如 A/R。只有已经登记的人物与地点可以检索。</div><div class="toolbox"><input id="cmd" class="search-input" placeholder="输入人物编号/地点编号"><button onclick="run()">检索资料</button><button onclick="hint()">请求 SELA 提示</button></div><div class="toolbox"><button onclick="toggle('examine-box')">打开调查面板</button><button onclick="toggle('restore-panel')">打开案件推演</button></div></div><div id="examine-box"><h2>调查面板</h2><div id="box-content" class="empty-box">请从物品栏选择资料放入...</div><div class="box-counter" id="box-counter">已放置 0/3 个物品</div><div class="small">提示：最多可同时放入3项资料进行交叉调查。</div><div class="toolbox"><button class="action-btn" onclick="combine()">调查资料</button><button onclick="clearSel()">清空面板</button></div></div><div id="restore-panel"><h2>案件推演系统</h2><p class="small">只有当不同人物、地点和物证能够互相支撑时，SELA才允许建立推演。</p><div id="restoreBody"></div></div></main><aside class="sidebar"><section class="panel"><h2>人物档案</h2><div id="people" class="item-wrap"></div></section><section class="panel"><h2>地点记录</h2><div id="places" class="item-wrap"></div></section><section class="panel"><h2>物品栏</h2><div id="items" class="item-wrap"></div></section><section class="panel"><h2>已发现词条</h2><div id="terms" class="item-wrap"></div></section><section class="panel"><h2>案件概要</h2><p class="case-note">委托人：周夫妇</p><p class="case-note">失踪者：周扬名，男，6岁</p><p class="small">雨夜，周家车辆撞上护栏。父母重伤获救。等警方开始核对身份时，原本坐在后排的孩子已经不见了。</p></section><section class="panel"><h2>寻人启事录像</h2><video id="missingVideo" class="video" controls src="assets/missing-boy.mp4"></video><p class="small">这是家属后来公开发布的寻人录像。</p></section></aside></div><script>
const P={A:'周夫妇｜委托人',B:'侦探｜你',C:'陈国安｜警官',D:'林淑琴｜关联人物',E:'赵志强｜货车司机',F:'孙丽华｜急救护士',G:'吴建民｜店主',H:'郑凯｜出租车司机',I:'罗春梅｜居民',J:'周扬名｜失踪男童'},L={R:'Road｜青禾路',A:'Apartment｜周家',H:'Hospital｜市二院',B:'Bridge｜东渠桥',S:'Store｜建民小卖部',T:'Taxi Stand｜旧客运站',P:'Police｜城南派出所',G:'Gas Station｜南环加油站'};let st={p:new Set(['A','B','C']),l:new Set(['R','A']),t:new Set(),seen:new Set(),items:new Set(['事故现场照片','周扬名寻人启事']),sel:[],rest:new Set(),comb:new Set()};const out=document.getElementById('output');function log(x,c=''){out.insertAdjacentHTML('beforeend',`<div class="${c}">${x}</div>`);out.scrollTop=out.scrollHeight}function sela(x){log(`<span class="sela">SELA：</span>${x}`)}function rec(t,x){return `<div class="record"><b>${t}</b><div>${x}</div></div>`}function chat(t,a){return `<div class="record"><b>${t}</b>${a.map(x=>`<div class="chat-message"><span class="chat-sender">${x[0]}：</span>${x[1]}</div>`).join('')}</div>`}function term(x){if(!st.t.has(x)){st.t.add(x);render()}}function addItem(x,msg=''){if(!st.items.has(x)){st.items.add(x);log(`新资料：<b>${x}</b>`,'new');if(msg)sela(msg);render()}}function unlockP(x,msg=''){if(!st.p.has(x)){st.p.add(x);log(`人物档案已更新：<b>${x} ${P[x]}</b>`,'new');sela(msg||'我先把这个名字记下来。名字本身不是结论，只是新的调查入口。');render()}}function unlockL(x,msg=''){if(!st.l.has(x)){st.l.add(x);log(`地点记录已更新：<b>${x} ${L[x]}</b>`,'new');sela(msg||'这个地点第一次出现在资料里。也许值得去看看。');render()}}
const R={'A/A':()=>{addItem('蓝色玩具汽车','这东西本身很普通。但对家属来说，越普通的东西，往往记得越清楚。');term('后排右座');return rec('与周夫妇的第二次谈话','周明远：“扬名一直坐后排右边。出门前还非要找那辆蓝色小汽车。”<br><br>周母沉默了很久：“他那天不肯系好外套拉链，我还说了他一句……如果我当时没催他出门就好了。”<br><br>周明远：“别这么说。我们现在只想知道，他后来到底去了哪。”')},'A/R':()=>{unlockP('F','父亲的记忆里出现了急救人员。与其继续追问一个刚从昏迷里醒来的人，不如找另一个当时清醒的目击者。');unlockL('H','救护人员的正式记录应该在医院。');term('儿童哭声');return rec('周明远对事故的记忆','“撞上以后我醒过一小会儿。耳朵里全是雨声和人喊话。我听见扬名哭了一声，好像在叫爸爸。”<br><br>“我想回头，可我动不了。后来有人一直问我名字，再往后……真的记不住了。”')},'C/R':()=>{unlockP('E','这个人不是警方证人名单里的重点，但他比警方更早站在路边。先别忽略他。');addItem('现场警戒记录');term('现场封锁');return rec('陈国安｜现场记录','21:24接警。21:31警方到场时，急救人员已经开始处置伤者，外围警戒尚未完成。赵志强曾在路肩协助。后排右门开启。<br><br>陈国安：“当年我们一直按孩子自己跑出去的方向找。现在回头看……有些前提，可能从一开始就没人确认过。”')},'C/P':()=>{addItem('首次搜寻范围图','这张图很刺眼。不是因为搜索范围小，而是因为它建立在“孩子还在附近”这个假设上。');term('搜索方向偏差');return rec('警方第一次搜索复盘','搜索集中于事故点附近沟渠、绿化带和道路两侧。22:06，医院才从清醒家属口中确认车内原本还有一名六岁男童。<br><br>陈国安：“二十多分钟。现在看很短，当时却足够一辆车开出去很远。”')},'F/H':()=>{addItem('急救出车单');term('急救优先');return rec('孙丽华｜值班室谈话','“两名成年人都很重，我们先保命。后排门已经开了。”<br><br>“我记得问过一句，孩子谁抱着？旁边有人回了句‘家里人’。谁说的，我真记不清。”<br><br>她停了一下：“这些年我偶尔也会想，如果当时多问一句呢？”')},'F/R':()=>{term('儿童哭声');return rec('孙丽华｜现场回忆','“有。我确实听见过小孩哭，就一下，很短。”<br><br>“后排旁边当时不止一个人。雨太大，我连脸都看不清。你问我是谁把孩子抱起来的——我不能为了帮你破案就编一个答案。”')},'E/R':()=>{unlockL('B','赵志强两次提到桥边。先把东渠桥加入地图。');term('灰色外套');return rec('赵志强｜第一次谈话','“我就是下车帮忙，没想惹事。”<br><br>“后门边有个穿灰外套的女的。我真以为是家属。她站得太自然了，没人拦她。”')},'E/B':()=>{unlockP('I','赵志强不相信她，但他记得她的名字。一个被别人认为“看错了”的证人，有时反而值得单独听完。');return rec('赵志强｜桥边补充','“罗春梅那晚一直说有人抱着孩子往桥东走。我当时还说她眼花。雨那么大，隔那么远，谁敢认？”')},'I/B':()=>{unlockP('G','她没有看见终点，只看见方向。桥东唯一还亮着灯的店，老板可能接得上这段空白。');unlockL('S');term('抱离');return rec('罗春梅｜家中谈话','“我没说我看清脸了。我只说，我看见一个穿灰衣服的女人抱着孩子。”<br><br>“孩子头靠她肩上，不像自己走的。她往桥东去。”<br><br>“你们当年没人信我。老吴的小卖部那时候还开着，你去问他。”')},'G/S':()=>{unlockP('H','小卖部老板记住了一辆出租车。接下来别只问“女人是谁”，也问问“她怎么离开的”。');unlockL('T');addItem('小卖部赊账纸');term('红色塑料袋');return rec('吴建民｜小卖部','“九点多吧，一个女的抱着男孩进来。孩子衣服湿透了，她买毛巾和水，我给了个红塑料袋。”<br><br>“男孩没怎么说话。我当时还觉得他可能吓着了。”<br><br>“后来老郑的出租车停门口。我以为是母子，谁会多管？”')},'H/T':()=>{addItem('出租车调度抄件');term('未登记乘客');return chat('旧客运站｜调度记录',[['调度','你不是说那晚没拉人吗？'],['郑凯','不是那个。'],['调度','哪个？'],['郑凯','桥边那个女的。'],['调度','林姐？'],['郑凯','你别乱说，我没说名字。']])},'G/B':()=>{term('林淑琴');return chat('陈国安与吴建民｜补充询问',[['陈国安','你认识以前住桥东的林淑琴？'],['吴建民','认识。林家早搬了。'],['陈国安','事故晚上见过她吗？'],['吴建民','那个女的侧脸有点像她……'],['陈国安','像，还是就是？'],['吴建民','我不敢说就是。隔这么多年，我不能害人。']])},'H/S':()=>{term('南环');return rec('郑凯｜第二次谈话','“行，我承认。那晚确实拉过一个抱孩子的女人。”<br><br>“她说去南环，现金。一路上没怎么说话。孩子像睡着了。”<br><br>“为什么没登记？那时候这种短单……我嫌麻烦。”')},'D/T':()=>{unlockL('G','如果里程没有记错，南环不是一句模糊回忆，而是可以继续落到地图上的地方。');addItem('异常里程记录');term('临时停车');return rec('旧客运站｜纸本资料','调度纸本边角出现“林淑琴”的姓名缩写。郑凯车辆21:40—22:10里程增加约8公里，该段没有对应乘客登记。')},'D/G':()=>{addItem('加油站旧账页','这大概是目前路线最远的一张纸。再往后，没有姓名，没有完整车牌，只有一句随手写下来的备注。');term('换乘可能');return rec('南环加油站｜旧账旁注','值班员手写：“一女带一小孩借电话，后上一辆白色面包车。”<br><br>车牌未记全，身份无法确认。<br><br>纸页下方还有一句已经褪色的字：“小孩一直没醒？”')},'J/R':()=>{term('事故后存活');return rec('J｜周扬名现场身份链','周夫妇的座位记忆、两份独立儿童声音证词、后排痕迹彼此能够对应。<br><br><span class="sela">SELA：</span>至少在事故发生后的短时间里，周扬名还活着。这不是安慰，是目前证据能够支持的事实。')}};
function run(){let q=cmd.value.trim().toUpperCase();cmd.value='';let z=q.split('/');if(z.length!==2)return sela('我没办法理解这个检索。试试“人物编号/地点编号”，比如 A/R。');let[p,l]=z;if(!st.p.has(p))return sela(`我还不知道 ${p} 是谁。与其猜编号，不如回头看看已经出现过的名字。`);if(!st.l.has(l))return sela(`地点 ${l} 还没有出现在调查里。我们不能调查一个目前还不知道存在的地方。`);if(!R[q])return sela('我查过啦，这个人和这个地点暂时没有能用的记录。换条线试试看？');let first=!st.seen.has(q);st.seen.add(q);log(R[q]());if(!first)sela('这份记录我们看过啦。不过没关系，旧证词有时候会在发现新线索之后变得很有意思。');after();renderRestore()}function after(){if(st.seen.has('A/A')&&st.seen.has('A/R')&&st.seen.has('F/R'))unlockP('J','三份资料终于能把“那个孩子”明确指向周扬名。我帮你把他的档案单独建好啦。');if(st.seen.has('H/T')&&st.seen.has('G/B'))unlockP('D','诶，同一个名字从两个不同地方出现了——林淑琴。先记下来，但我们可不能因为这样就把她当成答案哦。');if(st.seen.has('C/R')&&st.seen.has('F/H'))unlockL('P','现场记录和急救时间对上了。要不要回警署看看，当年的搜索到底是从哪里开始跑偏的？')}function pick(x){if(st.sel.includes(x))st.sel=st.sel.filter(v=>v!==x);else if(st.sel.length<3)st.sel.push(x);else return sela('调查桌放满啦，最多三样！证据太多一起塞进来，我也会头大的。');render()}function clearSel(){st.sel=[];render()}function key(){return [...st.sel].sort().join('|')}const combos={'事故现场照片|现场警戒记录':()=>{term('后排车门');addItem('后排儿童鞋印照片');return '照片里的泥水痕迹和警戒记录能对上：后排右门被打开，门外存在儿童鞋印。'},'急救出车单|现场警戒记录|周扬名寻人启事':()=>{term('身份确认空窗');return '救护早于完整警戒，父母无法立即确认孩子身份。所有人都在做最紧急的事，于是恰好没人负责确认“抱孩子的人是谁”。'},'后排儿童鞋印照片|蓝色玩具汽车':()=>{term('儿童曾离车');return '鞋印从后排右侧延伸到车外。周扬名事故后离开过座位，但离开车厢不等于自己离开现场。'},'出租车调度抄件|小卖部赊账纸':()=>{term('同一女性可能');return '小卖部时间窗口和那趟没有登记的出租车能够接起来。'},'出租车调度抄件|异常里程记录':()=>{term('南环路线吻合');return '异常里程与旧客运站到南环的距离基本吻合。'},'加油站旧账页|异常里程记录|周扬名寻人启事':()=>{term('二次转移');return '年龄、时间、路线都能接上。白色面包车无法确认，但南环未必是终点。'},'出租车调度抄件|异常里程记录|首次搜寻范围图':()=>{term('脱离搜索圈');return '警方还在事故点附近寻找一个“可能自己走失的孩子”时，那趟出租车已经可能把他带出了搜索圈。'}};function combine(){if(st.sel.length<2)return sela('再放一项资料嘛。一张纸只能讲自己的故事，两张以上才有机会互相作证。');let k=key(),f=combos[k];if(!f)return sela('唔……我试着把它们拼了一下，现在还连不起来。先放着吧，别为了得到答案硬凑证据。');if(st.comb.has(k))return sela('这组我们已经分析过啦，结论暂时没有变化。');st.comb.add(k);sela(`<br><b>交叉分析完成 ✓</b><br>${f()}`);clearSel();renderRestore()}
const rs=[['r1','推演01｜车内的孩子是谁',['A/A','A/R','F/R'],['后排右座','儿童哭声'],'A + F','座位信息和两份独立声音证词，把事故后的儿童与周扬名对应起来。'],['r2','推演02｜事故后，他还活着吗',['J/R'],['事故后存活'],'A + F + J','至少在事故后的短时间内，周扬名仍有生命反应。'],['r3','推演03｜后排右门发生了什么',['C/R'],['后排车门','儿童曾离车'],'C + 现场物证','孩子事故后离开过后排座位，但不能因此推断他是自己走远的。'],['r4','推演04｜谁在看着那个孩子',['C/R','F/H','E/R'],['现场封锁','急救优先','身份确认空窗'],'C + E + F','答案可能是：当时没有任何一个人真正负责确认他的身份。'],['r5','推演05｜灰衣女性的移动路线',['E/B','I/B','G/S'],['灰色外套','抱离'],'E + G + I','后门、桥东、小卖部三段目击能够形成连续路线。'],['r6','推演06｜小卖部以后',['G/S','H/T','H/S'],['未登记乘客','南环','同一女性可能'],'G + H','女人和孩子没有继续步行，而是乘坐郑凯的出租车前往南环。'],['r7','推演07｜“林姐”是谁',['H/T','G/B','D/T'],['林淑琴','临时停车'],'D + G + H','多个来源把“林姐”和林淑琴联系起来，但这仍然只是高度相关，不是定罪。'],['r8','推演08｜为什么没找到',['C/P','H/S'],['搜索方向偏差','南环路线吻合','脱离搜索圈'],'C + H','警方开始按“附近走失”搜索时，孩子可能已经乘车离开最初搜索圈。'],['r9','推演09｜南环是终点吗',['D/G'],['换乘可能','二次转移'],'D + 南环资料','南环更像一次中转。白色面包车让路线继续向一个没有记录的方向延伸。'],['r10','最终推演｜周扬名去了哪里',['D/G','J/R'],['事故后存活','身份确认空窗','抱离','南环路线吻合','二次转移'],'全部证词','我们能把路线推到第二次转移，却不能诚实地替缺失的记录写出一个目的地。']];function can(r){return r[2].every(x=>st.seen.has(x))&&r[3].every(x=>st.t.has(x))}function restoreOne(id){let r=rs.find(x=>x[0]===id);if(!can(r))return sela('还差一点点。这个推演里有块拼图还没找到，我们先去别处看看？');st.rest.add(id);log(`<div class="record"><b>${r[1]}｜推演成立</b><br>${r[5]}</div>`);if(id==='r2')sela('找到他事故后仍然活着的证据了。虽然有点难受，但这一步很重要……我们继续。');else if(id==='r7')sela('名字出现得再多也不能直接变成罪名。放心，我会帮你盯着这条界线。');else if(id==='r10')sela('我们已经走到资料能带我们抵达的最远处啦。剩下的空白，就留给真正的证据，而不是猜测。');renderRestore()}function renderRestore(){restoreBody.innerHTML=rs.map(r=>`<div class="restore-card ${st.rest.has(r[0])?'done':''}"><b>${r[1]}</b><div class="small">交叉人物：${r[4]}</div><p>${st.rest.has(r[0])?'已完成':can(r)?'资料够啦，可以试着推演。':'还缺少证词或词条。'}</p>${!st.rest.has(r[0])?`<button onclick="restoreOne('${r[0]}')">开始推演</button>`:''}</div>`).join('')+(rs.every(r=>st.rest.has(r[0]))?'<div class="restore-card done"><b>SELA：案件模型完成啦！</b><p>我们已经一起走到现有资料的尽头。准备好的话，就生成最终案件报告吧。</p><button class="submit-btn" onclick="finish()">生成最终案件报告</button></div>':'')}function finish(){localStorage.setItem('lost_memory_complete','1');location.href='ending.html'}function hint(){let order=['A/A','A/R','C/R','F/H','F/R','E/R','E/B','I/B','G/S','H/T','G/B','H/S','J/R','C/P','D/T','D/G'];let n=order.find(q=>!st.seen.has(q)&&st.p.has(q[0])&&st.l.has(q[2]));if(n)sela(`嘿嘿，我不直接剧透。不过我可以偷偷指个方向：<b>${P[n[0]].split('｜')[0]}</b> 和 <b>${L[n[2]].split('｜')[1]}</b> 之间还有东西没看。试试 ${n}？`);else sela('能直接查的差不多都看完啦。看看调查面板和案件推演吧，说不定有几张已经拿到的资料还没被你放在一起。')}function toggle(id){let e=document.getElementById(id);e.style.display=e.style.display==='block'?'none':'block'}function render(){people.innerHTML=[...st.p].sort().map(x=>`<div class="item-box person-box">${x}<br><span class="small">${P[x]}</span></div>`).join('');places.innerHTML=[...st.l].map(x=>`<div class="item-box place-box">${x}<br><span class="small">${L[x]}</span></div>`).join('');items.innerHTML=[...st.items].map(x=>`<div onclick="pick('${x}')" class="item-box ${st.sel.includes(x)?'term-box':''}">${x}</div>`).join('');terms.innerHTML=[...st.t].map(x=>`<div class="item-box term-box">${x}</div>`).join('')||'<span class="empty-box">尚未发现词条</span>';document.getElementById('box-content').innerHTML=st.sel.length?st.sel.map(x=>`<div class="item-in-box" onclick="pick('${x}')">${x}</div>`).join(''):'请从物品栏选择资料放入...';document.getElementById('box-counter').textContent=`已放置 ${st.sel.length}/3 个物品`}cmd.addEventListener('keydown',e=>{if(e.key==='Enter')run()});missingVideo.addEventListener('ended',()=>{addItem('寻人启事录像记录','录像看完啦。我帮你收进档案里。家属能公开的东西几乎都放进去了……希望我们能找到一点他们当时没能找到的东西。');term('公开寻人时间')});render();renderRestore();sela('你好呀！我是你的私人调查助手 SELA，很高兴又和你一起查案啦。');sela('资料、人物、地点，还有那些容易被忽略的小细节，我都会帮你整理好。你负责大胆怀疑，我负责提醒你别被证据骗走～');log('<div class="record"><b>新的委托</b>周夫妇希望重新调查儿子周扬名在交通事故后的失踪。警方当年的结论停在“长期失踪”。<br><br>这一次，我们只追一个问题：<b>事故以后，这个孩子去了哪里？</b></div>');sela('目前有 A、B、C 三个人物，以及事故现场 R 和周家 A。输入“人物/地点”就能开始调查。卡住的时候也可以叫我，我一直在这里哦。');</script></body></html>
