<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOST MEMORY｜周扬名失踪案</title><style>*{box-sizing:border-box}body{margin:0;background:#090b0d;color:#d9dde1;font:14px/1.65 Consolas,"Microsoft YaHei",sans-serif}.wrap{max-width:1250px;margin:auto;padding:16px;display:grid;grid-template-columns:1fr 350px;gap:15px}header{grid-column:1/-1;border-bottom:1px solid #30363d;padding:8px 0 14px}h1{margin:0;color:#d5ad5b;letter-spacing:3px}.sub,.small{color:#818a92;font-size:12px}.box{background:#101418;border:1px solid #2b3137;border-radius:5px;padding:13px;margin-bottom:13px}#out{height:450px;overflow:auto}.sela{color:#59d3aa}.sys{color:#e8a66a}.new{color:#71aee8}.warn{color:#e27676}.rec{border-left:3px solid #3f596d;background:#151b20;padding:10px;margin:9px 0}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}input,button{background:#181d22;color:#ddd;border:1px solid #3b434b;padding:8px;border-radius:3px}input{flex:1;min-width:150px}button{cursor:pointer}.tag{display:inline-block;border:1px solid #3d566b;color:#8ec5ef;padding:4px 7px;margin:3px;border-radius:3px}.person{border-color:#5b4d2e;color:#e2c477}.item{border-color:#4e5d3d;color:#bad18d;cursor:pointer}.selected{background:#334027}.locked{color:#555}.panel{display:none}.restoreCard{border:1px solid #343b42;padding:10px;margin:8px 0}.done{border-color:#4f806c}.chat{background:#111820;padding:9px;margin-top:7px}.who{color:#e2c477}@media(max-width:850px){.wrap{grid-template-columns:1fr}#out{height:400px}}</style></head><body><div class="wrap"><header><h1>LOST MEMORY</h1><div class="sub">CASE 00｜周扬名失踪案｜SELA Investigation System</div></header><main><div class="box" id="out"></div><div class="box"><b>资料检索</b><div class="small">输入格式：人物编号/地点编号，例如 A/R。新人物和地点会随调查逐步登记。</div><div class="controls"><input id="cmd" placeholder="A/R"><button onclick="run()">检索</button><button onclick="hint()">SELA提示</button><button onclick="show('lab')">调查面板</button><button onclick="show('restore')">证词推演</button></div></div><div class="box panel" id="lab"><b>调查面板</b><p class="small">选择最多3项资料进行交叉分析。</p><div id="slots"></div><div class="controls"><button onclick="combine()">分析所选项目</button><button onclick="clearSel()">清空</button></div></div><div class="box panel" id="restore"><b>证词推演</b><div id="restoreBody"></div></div><div class="box"><b>词条库</b><div id="terms"></div></div></main><aside><div class="box"><b>人物档案</b><div id="people"></div></div><div class="box"><b>地点</b><div id="places"></div></div><div class="box"><b>物品 / 资料</b><div id="items"></div></div><div class="box"><b>案件概要</b><p>委托方：周夫妇</p><p>失踪者：周扬名，男，6岁</p><p class="small">雨夜车辆撞击护栏。父母重伤获救，后排男童随后失踪。</p></div><div class="box"><b>寻人启事录像</b><video id="missingVideo" controls style="width:100%" src="assets/missing-boy.mp4"></video><div class="small">观看完毕后，SELA会登记录像资料。</div></div></aside></div><script>
const P={A:'周明远｜父亲',B:'侦探｜玩家',C:'陈国安｜警官',D:'林淑琴｜关联人物',E:'赵志强｜货车司机',F:'孙丽华｜急救护士',G:'吴建民｜店主',H:'郑凯｜出租车司机',I:'罗春梅｜居民',J:'周扬名｜失踪男童'};const L={R:'Road｜青禾路',A:'Apartment｜周家',H:'Hospital｜市二院',B:'Bridge｜东渠桥',S:'Store｜建民小卖部',T:'Taxi Stand｜旧客运站',P:'Police｜城南派出所',G:'Gas Station｜南环加油站'};
let st={p:new Set(['A','B','C']),l:new Set(['R','A']),t:new Set(),seen:new Set(),items:new Set(['事故现场照片','周扬名寻人启事']),sel:[],rest:new Set(),comb:new Set()};
function rec(t,x){return `<div class="rec"><b>${t}</b><div>${x.replace(/\n/g,'<br>')}</div></div>`}function chat(t,a){return `<div class="rec"><b>${t}</b><div class="chat">${a.map(x=>`<div><span class="who">${x[0]}：</span>${x[1]}</div>`).join('')}</div></div>`}function log(x,c=''){out.insertAdjacentHTML('beforeend',`<div class="${c}">${x}</div>`);out.scrollTop=out.scrollHeight}function term(x){if(!st.t.has(x)){st.t.add(x);render()}}function addItem(x){if(!st.items.has(x)){st.items.add(x);log(`SELA：新资料加入物品栏：<b>${x}</b>`,'new');render()}}function unlockP(x){if(!st.p.has(x)){st.p.add(x);log(`SELA：记录中确认新人物：<b>${x} — ${P[x]}</b>`,'new');render()}}function unlockL(x){if(!st.l.has(x)){st.l.add(x);log(`SELA：新地点：<b>${x} — ${L[x]}</b>`,'new');render()}}
const R={'A/A':()=>{addItem('蓝色玩具汽车');term('后排右座');return rec('周明远补充陈述','“扬名一直坐后排右边。出门前还在找那辆蓝色小汽车。醒过来以后，警察却告诉我车里没有孩子。”')},'A/R':()=>{unlockP('F');unlockL('H');term('儿童哭声');return rec('周明远事故记忆','“撞上以后我醒过一小会儿。我听见扬名哭，喊了一声爸爸。后来有人在问话，再往后就没印象了。”')},'C/R':()=>{unlockP('E');addItem('现场警戒记录');term('现场封锁');return rec('陈国安现场笔录','21:24接警，21:31到场。救护人员已经开始处置伤者，外围警戒尚未完成。赵志强在路肩协助。后排右门开启。')},'C/P':()=>{addItem('首次搜寻范围图');term('搜索方向偏差');return rec('警方复盘','最初搜索集中在事故点周边沟渠、绿化带与道路两侧。直到22:06，医院才确认车内原本应有一名六岁男童。')},'F/H':()=>{addItem('急救出车单');term('急救优先');return rec('孙丽华救护记录','21:23抵达。两名成年人均需优先处置。后排门已开。“我问孩子是谁抱着，旁边有人说家里人，我就继续抢救。”')},'F/R':()=>{term('儿童哭声');return rec('孙丽华现场回忆','“我听见过一次小孩哭，很短。当时后排旁边至少有两三个路人。我没看清是谁把孩子抱起来。”')},'E/R':()=>{unlockL('B');term('灰色外套');return rec('赵志强第一次证词','“我到的时候救护车还没停稳。后门边有个穿灰外套的女人。我以为是家属，就没问。后来我去桥边挪车。”')},'E/B':()=>{unlockP('I');return rec('赵志强补充证词','“罗春梅那晚一直说有人抱孩子往桥东走。我当时觉得她看错了，雨那么大。”')},'I/B':()=>{unlockP('G');unlockL('S');term('抱离');return rec('罗春梅证词','“灰衣女人抱着个孩子往桥东走。孩子头靠在她肩上，不像自己走的。老吴的小卖部当时还亮着灯。”')},'G/S':()=>{unlockP('H');unlockL('T');addItem('小卖部赊账纸');term('红色塑料袋');return rec('吴建民口述','“九点多一个女的抱男孩进来买毛巾和水，拿了红塑料袋。后来老郑出租车停门口。我以为是母子。”')},'H/T':()=>{addItem('出租车调度抄件');term('未登记乘客');return chat('郑凯与调度旧记录',[['调度','你不是说那晚没拉人吗？'],['郑凯','不是那个。'],['调度','哪个？'],['郑凯','桥边那个女的。'],['调度','林姐？'],['郑凯','你别乱说，我没说名字。']])},'G/B':()=>{term('林淑琴');return chat('吴建民后续聊天',[['陈国安','你认识以前住桥东的林淑琴？'],['吴建民','认识。林家早搬了。'],['陈国安','事故晚上见过她吗？'],['吴建民','那个女的侧脸有点像她……我不敢认。']])},'H/S':()=>{term('南环');return rec('郑凯第二次陈述','“女的抱孩子敲车窗，说去南环。现金。她在加油站附近下车。具体几点，我是真记不住了。”')},'D/T':()=>{unlockL('G');addItem('异常里程记录');term('临时停车');return rec('旧客运站排查资料','调度纸本出现“林淑琴”姓名缩写。郑凯车辆21:40—22:10里程增加约8公里，该乘客没有登记。')},'D/G':()=>{addItem('加油站旧账页');term('换乘可能');return rec('南环加油站旧账旁注','值班员写有：“一女带一小孩借电话，后上一辆白色面包车。”车牌未记全，身份无法确认。')},'J/R':()=>{term('事故后存活');return rec('周扬名现场身份资料','家属记忆、儿童哭声、后排座位痕迹相互支持：事故发生后，周扬名仍在车辆附近并具有生命反应。')}};
function run(){let q=cmd.value.trim().toUpperCase();cmd.value='';let z=q.split('/');if(z.length!==2)return log('SELA：检索格式为“人物编号/地点编号”，例如 A/R。','sela');let[p,l]=z;if(!st.p.has(p))return log(`SELA：人物 ${p} 尚未登记。继续阅读已有资料。`,'sela');if(!st.l.has(l))return log(`SELA：地点 ${l} 尚未开放。`,'sela');if(!R[q])return log(`SELA：没有找到 ${q} 的有效关联记录。`,'sela');st.seen.add(q);log(R[q]());after();renderRestore()}
function after(){if(st.seen.has('A/A')&&st.seen.has('A/R')&&st.seen.has('F/R'))unlockP('J');if(st.seen.has('H/T')&&st.seen.has('G/B'))unlockP('D');if(st.seen.has('C/R')&&st.seen.has('F/H'))unlockL('P')}
function pick(x){if(st.sel.includes(x))st.sel=st.sel.filter(v=>v!==x);else if(st.sel.length<3)st.sel.push(x);else return log('SELA：一次最多选择3项资料。','sela');render()}function clearSel(){st.sel=[];render()}function key(){return [...st.sel].sort().join('|')}
const combos={'事故现场照片|现场警戒记录':()=>{term('后排车门');addItem('后排儿童鞋印照片');return '后排右门在救援前后被人为打开。泥水痕迹集中于右侧车门外。'},'急救出车单|现场警戒记录|周扬名寻人启事':()=>{term('身份确认空窗');return '救护早于完整警戒，成年人伤势严重，儿童身份又未被清醒家属确认。存在短暂身份确认空窗。'},'后排儿童鞋印照片|蓝色玩具汽车':()=>{term('儿童曾离车');return '儿童鞋印由后排右侧延伸至车外，支持周扬名事故后曾离开座位，但不能证明其自行远离现场。'},'出租车调度抄件|小卖部赊账纸':()=>{term('同一女性可能');return '小卖部时间窗口和出租车未登记行程能够衔接，两份记录可能描述同一名抱儿童女性。'},'出租车调度抄件|异常里程记录':()=>{term('南环路线吻合');return '异常里程与旧客运站至南环路线吻合，郑凯最初“没有载客”的说法不能成立。'},'加油站旧账页|异常里程记录|周扬名寻人启事':()=>{term('二次转移');return '年龄、时间和地点均能衔接。不能确认白色面包车身份，但存在二次转移可能。'},'首次搜寻范围图|出租车调度抄件|异常里程记录':()=>{term('脱离搜索圈');return '警方最初地面搜索仍围绕事故点展开时，相关出租车已经可能把儿童带出搜索圈。'}};
function combine(){if(st.sel.length<2)return log('SELA：至少选择2项。','sela');let k=key(),f=combos[k];if(!f)return log('SELA：这组资料不能形成可靠推论。','sela');if(st.comb.has(k))return log('SELA：该组合已经分析。','sela');st.comb.add(k);log(`<b>SELA交叉分析：</b>${f()}`,'sela');clearSel();renderRestore()}
const rs=[['r1','推演01｜车内的孩子就是周扬名',['A/A','A/R','F/R'],['后排右座','儿童哭声'],'A + F','家属座位信息与两份独立声音证词相互支持，事故后的儿童可与周扬名建立身份对应。'],['r2','推演02｜事故后仍有生命反应',['J/R'],['事故后存活'],'A + F + J','周扬名没有在撞击中当场死亡，这是后续路线成立的前提。'],['r3','推演03｜后排右门发生了什么',['C/R'],['后排车门','儿童曾离车'],'C + 现场物证','门体与泥水痕迹显示儿童在事故后离开后排座位，但“离车”不等于“自行走失”。'],['r4','推演04｜现场身份确认空窗',['C/R','F/H','E/R'],['现场封锁','急救优先','身份确认空窗'],'C + E + F','警戒未完成、成年人优先抢救、路人误把灰衣女性当家属，使现场出现短暂身份确认空窗。'],['r5','推演05｜灰衣女性是否抱走儿童',['E/B','I/B','G/S'],['灰色外套','抱离'],'E + G + I','三个视角把“后门附近灰衣女性—桥东抱童—小卖部一女抱男孩”连接为连续事件。'],['r6','推演06｜小卖部之后的交通方式',['G/S','H/T','H/S'],['未登记乘客','南环','同一女性可能'],'G + H','小卖部记录与未登记出租车行程能够衔接，步行路线在此转为机动车路线。'],['r7','推演07｜“林姐”与林淑琴',['H/T','G/B','D/T'],['林淑琴','临时停车'],'D + G + H','两个独立口述和纸本姓名缩写支持建立人物关联，但仍不能把关联直接写成刑事事实。'],['r8','推演08｜警方为何一直在错误区域搜索',['C/P','H/S'],['搜索方向偏差','南环路线吻合','脱离搜索圈'],'C + H','警方确认儿童失踪时，相关车辆可能已经驶出事故点搜索范围，因此早期地面搜索天然滞后。'],['r9','推演09｜南环是否为终点',['D/G'],['换乘可能','二次转移'],'D + 南环资料','加油站旧记录把路线继续延伸至一辆身份不明的白色面包车。南环更像中转点，而不是终点。'],['r10','最终推演｜周扬名去了哪里',['D/G','J/R'],['事故后存活','身份确认空窗','抱离','南环路线吻合','二次转移'],'A + C + D + E + F + G + H + I + J','现有资料能够建立从事故现场到南环二次转移的连续模型，但无法确认白色面包车之后的具体目的地。']];
function can(r){return r[2].every(x=>st.seen.has(x))&&r[3].every(x=>st.t.has(x))}function restoreOne(id){let r=rs.find(x=>x[0]===id);if(!can(r))return log('SELA：推演条件不足。','sela');st.rest.add(id);log(`<b>${r[1]} 完成</b><br>${r[5]}`,'sys');renderRestore()}function renderRestore(){restoreBody.innerHTML=rs.map(r=>`<div class="restoreCard ${st.rest.has(r[0])?'done':''}"><b>${r[1]}</b><div class="small">涉及：${r[4]}</div><div class="small">${st.rest.has(r[0])?'已完成':can(r)?'可以推演':'资料不足'}</div>${!st.rest.has(r[0])?`<button onclick="restoreOne('${r[0]}')">进行推演</button>`:''}</div>`).join('')+(rs.every(r=>st.rest.has(r[0]))?'<div class="restoreCard done"><b>案件推演已闭合</b><p>全部十项推演完成。</p><button onclick="finish()">生成最终案件报告</button></div>':'')}
function finish(){localStorage.setItem('lost_memory_complete','1');location.href='ending.html'}function hint(){let order=['A/A','A/R','C/R','F/H','F/R','E/R','E/B','I/B','G/S','H/T','G/B','H/S','J/R','C/P','D/T','D/G'];let n=order.find(q=>!st.seen.has(q)&&st.p.has(q[0])&&st.l.has(q[2]));log(n?`SELA：建议继续核对 <b>${n}</b>。提示只表示资料关联，不代表嫌疑。`:'SELA：当前可直接检索资料已接近完成。检查调查面板与证词推演。','sela')}
function show(x){let e=document.getElementById(x);e.style.display=e.style.display==='block'?'none':'block'}function render(){people.innerHTML=[...st.p].sort().map(x=>`<span class="tag person">${x} ${P[x]}</span>`).join('');places.innerHTML=[...st.l].map(x=>`<span class="tag">${x} ${L[x]}</span>`).join('');terms.innerHTML=[...st.t].map(x=>`<span class="tag">${x}</span>`).join('')||'<span class="locked">尚无</span>';items.innerHTML=[...st.items].map(x=>`<span onclick="pick('${x}')" class="tag item ${st.sel.includes(x)?'selected':''}">${x}</span>`).join('');slots.innerHTML=st.sel.length?st.sel.map(x=>`<span class="tag item selected">${x}</span>`).join(''):'<span class="locked">未选择资料</span>'}cmd.addEventListener('keydown',e=>{if(e.key==='Enter')run()});missingVideo.addEventListener('ended',()=>{addItem('寻人启事录像记录');term('公开寻人时间');log('SELA：寻人启事录像已归档。','new')});render();renderRestore();log('<span class="sela">SELA：</span>调查终端已连接。周夫妇委托重新调查其子周扬名在交通事故后的失踪。');log('初始登记人物：A 周明远 / B 侦探 / C 陈国安<br>初始地点：R — Road / A — Apartment<br>检索格式为 <b>人物编号/地点编号</b>。其他编号需要从资料中逐步发现。','sys');</script></body></html>
