<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOST MEMORY</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(circle at 10% 20%,#1a1a2e,#090909 80%);color:#ddd;font:14px/1.65 'Segoe UI','Microsoft YaHei',sans-serif}.wrap{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 350px;gap:18px}.main,.side{display:flex;flex-direction:column;gap:16px}.panel,#box,#restore{background:#111;border:1px solid #333;border-radius:7px;padding:15px}#out{height:500px;overflow:auto}.record{margin:12px 0;padding:12px;background:#1a1a1a;border-left:3px solid #4cd1a3}.sela{color:#4cd1a3;font-weight:bold}b,h2{color:#e0b354}.small{color:#888;font-size:12px}.row,.items{display:flex;gap:8px;flex-wrap:wrap}button,input,select{background:#292929;color:#ddd;border:1px solid #444;border-radius:4px;padding:9px}button{cursor:pointer}button:hover{border-color:#e0b354}.cmd{width:100%}.chip{padding:8px;border:1px solid #444;background:#1b1b1b;border-radius:5px;color:#e0b354;cursor:pointer}.term{color:#6ab0e3}.place{color:#4cd1a3}#box,#restore,#videoPanel{display:none}.restore-card{margin:10px 0;padding:12px;border:1px solid #444;background:#191919}.restore-card.done{border-color:#2d5c2d;background:#14251b}.blank{display:inline-block;margin:2px 3px;min-width:115px;border:1px dashed #6ab0e3;padding:4px 6px;color:#6ab0e3;background:#111}.blank select{width:100%;padding:4px}.video{width:100%}@media(max-width:900px){.wrap{grid-template-columns:1fr}#out{height:430px}.chip{flex:1}}</style><body><div class="wrap"><main class="main"><div id="out" class="panel"></div><div class="panel"><h2>资料检索</h2><div class="small">人物编号/地点编号，例如 A/R。未登记编号无法检索。</div><input id="cmd" class="cmd" placeholder="输入人物编号/地点编号"><div class="row"><button onclick="run()">检索资料</button><button onclick="hint()">请求 SELA 提示</button><button onclick="toggle('box')">调查面板</button><button onclick="toggle('restore')">案件推演</button></div></div><div id="box"><h2>调查面板</h2><div id="selected"></div><div class="small">最多3项。放入顺序不影响分析结果。</div><div class="row"><button onclick="combine()">调查资料</button><button onclick="st.sel=[];render()">清空</button></div></div><div id="restore"><h2>案件推演</h2><p class="small">使用已经发现的词条补全推演。词条顺序由句子决定；资料调查顺序不影响组合。</p><div id="restoreBody"></div></div></main><aside class="side"><div class="panel"><h2>人物档案</h2><div id="people" class="items"></div></div><div class="panel"><h2>地点记录</h2><div id="places" class="items"></div></div><div class="panel"><h2>物品栏</h2><div id="items" class="items"></div></div><div class="panel"><h2>已发现词条</h2><div id="terms" class="items"></div></div><div class="panel"><h2>案件概要</h2>委托人：周夫妇<br>失踪者：周扬名，男，6岁<p class="small">雨夜出了车祸。周夫妇被送去医院，等警方重新核对车里的人时，原本坐在后排的孩子不见了。</p></div><div class="panel" id="videoPanel"><h2>寻人启事录像</h2><video id="missingVideo" class="video" controls src="missing-boy.MP4"></video></div></aside></div><script>const P={A:'周夫妇｜委托人',B:'侦探｜你',C:'陈国安｜警官',D:'林淑琴｜关联人物',E:'赵志强｜货车司机',F:'孙丽华｜急救护士',G:'吴建民｜店主',H:'郑凯｜出租车司机',I:'罗春梅｜居民',J:'周扬名｜失踪男童'},L={R:'Road｜青禾路',A:'Apartment｜周家',H:'Hospital｜市二院',B:'Bridge｜东渠桥',S:'Store｜建民小卖部',T:'Taxi Stand｜旧客运站',P:'Police｜城南派出所',G:'Gas Station｜南环加油站'};let st={p:new Set(['A','B','C']),l:new Set(['R','A']),t:new Set(),seen:new Set(),items:new Set(['事故现场照片','周扬名寻人启事']),sel:[],rest:new Set(),comb:new Set()};const O=document.getElementById('out');function log(x){O.insertAdjacentHTML('beforeend',`<div>${x}</div>`);O.scrollTop=O.scrollHeight}function sela(x){log(`<span class=sela>SELA：</span>${x}`)}function rec(t,x){return `<div class=record><b>${t}</b><br>${x}</div>`}function term(x){if(!st.t.has(x)){st.t.add(x);if(x==='公开寻人时间'){videoPanel.style.display='block';sela('检测到可关联公开资料。读取入口已建立。')}render()}}function item(x,m=''){if(!st.items.has(x)){st.items.add(x);log(`获得资料：<b>${x}</b>`);if(m)sela(m);render()}}function up(x,m='检测到新人物记录。已建立检索入口。'){if(!st.p.has(x)){st.p.add(x);sela(m);render()}}function ul(x,m='检测到新地点记录。已加入可检索范围。'){if(!st.l.has(x)){st.l.add(x);sela(m);render()}}const R={'A/A':()=>{item('蓝色玩具汽车');term('后排右座');return rec('周家｜再次询问','周明远：“他一直坐后排右边。出门的时候还在找那辆蓝色小汽车。”<br>周母：“最后记得最清楚的反而就是这些小事。”')},'A/R':()=>{up('F');ul('H');term('儿童哭声');return rec('青禾路｜周明远','“撞完以后我醒过一下。我听见扬名哭了一声，像是在喊我。后面还有谁，我真记不起来了。”')},'C/R':()=>{up('E');item('现场警戒记录');term('现场封锁');return rec('青禾路｜陈国安','“我们到的时候急救已经在忙，外围也没完全拦起来。后排右门是开的。当年大家都以为孩子自己跑了，但没人亲眼看见。”')},'C/P':()=>{item('首次搜寻范围图');term('搜索方向偏差');return rec('城南派出所｜陈国安','“第一轮就在事故点周围找。到22:06左右医院才确认车里原本还有个六岁孩子。要是坐车，二十多分钟就完全不一样了。”')},'F/H':()=>{item('急救出车单');term('急救优先');return rec('市二院｜孙丽华','“两个大人伤得重，我们先救人。我好像问过孩子谁抱着，有人回家里人。是谁说的，我不敢认。”')},'F/R':()=>{term('儿童哭声');return rec('青禾路｜孙丽华','“小孩哭声我听见过，就一下。后排那边好几个人，我没看清是谁把孩子抱起来的。”')},'E/R':()=>{ul('B');term('灰色外套');return rec('青禾路｜赵志强','“后门边有个穿灰外套的女的。我当时真以为她是家里人。脸没看清，雨太大。”')},'E/B':()=>{up('I');return rec('东渠桥｜赵志强','“罗春梅那晚一直说，她看见有人抱着小孩往桥东走。我当时还觉得她看错了。”')},'I/B':()=>{up('G');ul('S');term('抱离');return rec('东渠桥｜罗春梅','“我没看清脸。我就看见一个灰衣女的抱着孩子往桥东走。孩子头靠她肩上，不像自己在走。”')},'G/S':()=>{up('H');ul('T');item('小卖部赊账纸');term('红色塑料袋');return rec('建民小卖部｜吴建民','“九点多，一个女的抱着男孩进来，买了毛巾和水。后来老郑的出租车停门口。我当时没觉得不对。”')},'H/T':()=>{item('出租车调度抄件');term('未登记乘客');return rec('旧客运站｜残存调度记录','调度：“桥边那个女的？”<br>郑凯：“嗯。”<br>调度：“林姐？”<br>郑凯：“你别乱说，我没说名字。”')},'G/B':()=>{term('林淑琴');return rec('东渠桥｜补充询问','吴建民：“那个女的侧脸有点像林淑琴。只能说像，隔这么多年我哪敢说死。”')},'H/S':()=>{term('南环');return rec('建民小卖部｜郑凯','“那晚我是拉过一个抱孩子的女的。她说去南环，给现金。小孩靠着她，像睡着了。短单我嫌麻烦，没登记。”')},'D/T':()=>{ul('G');item('异常里程记录');term('临时停车');return rec('旧客运站｜旧纸本','纸边有很潦草的“林淑琴”缩写。郑凯车辆21:40—22:10多了约8公里，这段没有乘客登记。')},'D/G':()=>{item('加油站旧账页');term('换乘可能');return rec('南环加油站｜旧账旁注','“一女带一小孩借电话，后上一辆白色面包车。”车牌没记全。下面还有一行：“小孩一直没醒？”')},'J/R':()=>{term('事故后存活');return rec('周扬名｜现场记录整理','座位、哭声和后排痕迹可以互相对应。SELA分析：事故后的短时间内，目标仍存在生命反应。')}};function after(){if(['A/A','A/R','F/R'].every(x=>st.seen.has(x)))up('J','多项记录可对应同一儿童身份。已建立独立人物档案。');if(['H/T','G/B'].every(x=>st.seen.has(x)))up('D','检测到重复身份信息。对应关系尚未确认，已开放检索。');if(['C/R','F/H'].every(x=>st.seen.has(x)))ul('P','检测到现场处置与身份确认之间存在时间缺口。已开放相关记录。')}function run(){let q=cmd.value.trim().toUpperCase();cmd.value='';let z=q.split('/');if(z.length!==2)return sela('输入格式无法解析。');if(!st.p.has(z[0])||!st.l.has(z[1]))return sela('指定索引尚未登记。');if(!R[q])return sela('未检测到该索引组合的可读取记录。');let old=st.seen.has(q);st.seen.add(q);log(R[q]());if(old)sela('该记录已读取。未产生新增信息。');after();renderRestore()}function pick(x){if(st.sel.includes(x))st.sel=st.sel.filter(v=>v!==x);else if(st.sel.length<3)st.sel.push(x);else return sela('调查面板容量已满。');render()}function k(){return [...st.sel].sort().join('|')}const C={};function combo(a,f){C[[...a].sort().join('|')]=f}combo(['事故现场照片','现场警戒记录'],()=>{term('后排车门');item('后排儿童鞋印照片');return'后排右门曾打开，门外存在儿童鞋印。'});combo(['急救出车单','现场警戒记录','周扬名寻人启事'],()=>{term('身份确认空窗');return'现场处置期间存在身份确认缺口。'});combo(['后排儿童鞋印照片','蓝色玩具汽车'],()=>{term('儿童曾离车');return'儿童曾从后排右侧离开车厢。'});combo(['出租车调度抄件','小卖部赊账纸'],()=>{term('同一女性可能');return'时间记录存在重合。人物对应关系暂未确认。'});combo(['出租车调度抄件','异常里程记录'],()=>{term('南环路线吻合');return'里程数据与现有路线长度接近。'});combo(['加油站旧账页','异常里程记录','周扬名寻人启事'],()=>{term('二次转移');return'时间、年龄与路线存在连续性。后续车辆身份无法确认。'});combo(['出租车调度抄件','异常里程记录','首次搜寻范围图'],()=>{term('脱离搜索圈');return'车辆移动范围与第一轮搜索范围存在明显偏离。'});combo(['周扬名寻人启事','首次搜寻范围图'],()=>{term('公开寻人时间');return'检测到时间节点关联。'});function combine(){if(st.sel.length<2)return sela('资料数量不足。');let x=k(),f=C[x];if(!f)return sela('当前资料组合未形成稳定关联。');if(st.comb.has(x))return sela('该组合已分析。结论无变化。');st.comb.add(x);sela('<b>交叉分析完成</b><br>'+f());st.sel=[];render();renderRestore()}const RS=[{id:'r1',n:'推演01｜车内的孩子是谁',need:['A/A','A/R','F/R'],s:'家属确认周扬名坐在{0}，事故后又有{1}记录，因此可以把现场儿童与周扬名对应。',a:['后排右座','儿童哭声'],end:'现场儿童身份可以对应到周扬名。'},{id:'r2',n:'推演02｜事故后，他还活着吗',need:['J/R'],s:'现有资料可以确认：事故发生后的短时间内，周扬名处于{0}状态。',a:['事故后存活'],end:'事故本身不是失踪路线的终点。'},{id:'r3',n:'推演03｜后排右门发生了什么',need:['C/R'],s:'现场记录显示{0}，进一步比对后确认{1}。但这不能证明他是自己走远的。',a:['后排车门','儿童曾离车'],end:'孩子离开过后排，但离开现场的方式仍不明确。'},{id:'r4',n:'推演04｜救援时发生了什么',need:['C/R','F/H','E/R'],s:'现场处于{0}尚未完整建立、{1}的状态，并出现{2}。',a:['现场封锁','急救优先','身份确认空窗'],end:'救援阶段没人真正确认孩子由谁照看。'},{id:'r5',n:'推演05｜灰衣女性的路线',need:['E/B','I/B','G/S'],s:'多份目击都提到{0}，其中一份明确描述孩子被{1}并向桥东移动。',a:['灰色外套','抱离'],end:'目击路线可以从事故点接到桥东小卖部。'},{id:'r6',n:'推演06｜小卖部以后',need:['G/S','H/T','H/S'],s:'出租车存在{0}，目的地方向为{1}；与小卖部记录比对后，存在{2}。',a:['未登记乘客','南环','同一女性可能'],end:'两人可能从小卖部乘出租车前往南环。'},{id:'r7',n:'推演07｜“林姐”是谁',need:['H/T','G/B','D/T'],s:'两个来源都指向{0}，车辆记录同时存在{1}，但身份对应仍不能视为确认。',a:['林淑琴','临时停车'],end:'林淑琴与“林姐”高度关联，但不是定论。'},{id:'r8',n:'推演08｜为什么没找到',need:['C/P','H/S'],s:'警方早期存在{0}；车辆数据与{1}相符，因此孩子可能已经{2}。',a:['搜索方向偏差','南环路线吻合','脱离搜索圈'],end:'搜索仍在附近进行时，孩子可能已经乘车离开。'},{id:'r9',n:'推演09｜南环是终点吗',need:['D/G'],s:'加油站资料显示存在{0}，与前期资料结合后形成{1}的可能。',a:['换乘可能','二次转移'],end:'南环更像中转点，路线从第二辆车开始断开。'},{id:'r10',n:'最终推演｜周扬名去了哪里',need:['D/G','J/R'],s:'周扬名在事故后{0}，随后利用现场的{1}被人{2}；车辆路线与{3}相符，南环之后又存在{4}。',a:['事故后存活','身份确认空窗','抱离','南环路线吻合','二次转移'],end:'现有证据最多追到第二次转移，之后去向未知。'}];function ready(r){return r.need.every(x=>st.seen.has(x))&&r.a.every(x=>st.t.has(x))}function sentence(r){let s=r.s;return s.replace(/\{(\d+)\}/g,(_,i)=>`<span class=blank><select id="${r.id}_${i}"><option value="">选择词条</option>${[...st.t].map(t=>`<option>${t}</option>`).join('')}</select></span>`)}function submitR(id){let r=RS.find(x=>x.id===id);if(!ready(r))return sela('推演输入不足。');let ok=r.a.every((x,i)=>document.getElementById(`${id}_${i}`).value===x);if(!ok)return sela('词条排列无法形成稳定推演。请重新比对句意。');st.rest.add(id);log(rec(r.n+'｜推演成立',r.end));if(id==='r10')sela('推演结束。现有数据无法继续延伸路线。');renderRestore()}function renderRestore(){restoreBody.innerHTML=RS.map(r=>`<div class="restore-card ${st.rest.has(r.id)?'done':''}"><b>${r.n}</b>${st.rest.has(r.id)?`<p>${r.end}</p>`:ready(r)?`<p>${sentence(r)}</p><button onclick="submitR('${r.id}')">提交推演</button>`:'<p class=small>当前资料不足，无法建立完整语句。</p>'}</div>`).join('')+(RS.every(r=>st.rest.has(r.id))?'<div class="restore-card done"><b>SELA：案件模型已完成</b><p>现有资料已完成整合。</p><button onclick="finish()">生成最终案件报告</button></div>':'')}function finish(){localStorage.setItem('lost_memory_complete','1');location.href='ending.html'}function hint(){let m=[];if(Object.keys(R).some(q=>!st.seen.has(q)&&st.p.has(q[0])&&st.l.has(q[2])))m.push('现有调查网络存在未读取节点。','部分已登记信息尚未完成验证。');if(Object.keys(C).some(x=>!st.comb.has(x)&&x.split('|').every(y=>st.items.has(y))))m.push('当前资料库存在可比较项。建议执行交叉分析。');if(RS.some(r=>ready(r)&&!st.rest.has(r.id)))m.push('检测到可建立的语义推演。建议检查词条排列。');sela((m.length?m:['当前可读取信息增量较低。建议检查未闭合关联。'])[Math.floor(Math.random()*(m.length||1))])}function toggle(id){let e=document.getElementById(id);e.style.display=e.style.display==='block'?'none':'block'}function render(){people.innerHTML=[...st.p].map(x=>`<div class=chip>${x}<br><span class=small>${P[x]}</span></div>`).join('');places.innerHTML=[...st.l].map(x=>`<div class="chip place">${x}<br><span class=small>${L[x]}</span></div>`).join('');items.innerHTML=[...st.items].map(x=>`<div class=chip onclick="pick('${x}')">${x}</div>`).join('');terms.innerHTML=[...st.t].map(x=>`<div class="chip term">${x}</div>`).join('')||'<span class=small>尚未发现词条</span>';selected.innerHTML=st.sel.map(x=>`<button onclick="pick('${x}')">${x}</button>`).join(' ')||'<span class=small>未放入资料</span>'}cmd.addEventListener('keydown',e=>e.key==='Enter'&&run());missingVideo.addEventListener('ended',()=>item('寻人启事录像记录','录像读取完成。公开资料已归档。'));render();renderRestore();sela('连接完成。SELA 私人调查辅助系统已启动。');sela('人物、地点、证词与物证索引已载入。');log(rec('新的委托','周夫妇想重新查一遍儿子周扬名当年的失踪。那场车祸以后，两个人被送去了医院，孩子却没找到。<br><br>这次只查一件事：<b>事故以后，他去了哪里？</b>'));sela('当前可检索人物：A、B、C。当前可检索地点：R、A。');</script><script src="save-system.js"></script></body></html>
