<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOST MEMORY｜周扬名失踪案</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Microsoft YaHei',sans-serif}body{background:#0a0a0a;color:#e0e0e0;line-height:1.6;padding:20px;background-image:radial-gradient(circle at 10% 20%,#1a1a2e 0%,#0a0a0a 90%);min-height:100vh}.container{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 350px;gap:20px}.game-area{display:grid;gap:20px}#output{border:1px solid #333;padding:20px;height:500px;overflow-y:auto;background:#111;border-radius:8px;box-shadow:0 4px 12px #0008}.toolbox{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}button,input{padding:10px 15px;background:#2a2a2a;color:#e0e0e0;border:1px solid #444;border-radius:4px}button{cursor:pointer;transition:.3s}button:hover{background:#3a3a3a;border-color:#e0b354}.search-input{width:100%;background:#222}.sidebar{display:flex;flex-direction:column;gap:20px}.panel{border:1px solid #333;padding:15px;background:#111;border-radius:8px;box-shadow:0 4px 12px #0008}.panel h2,#examine-box h2,#restore-panel h2{color:#e0b354;margin-bottom:15px;padding-bottom:8px;border-bottom:1px solid #333;font-size:1.3rem}.item-wrap{display:flex;flex-wrap:wrap;gap:10px}.item-box{color:#e0b354;cursor:pointer;padding:10px;border:1px solid #333;border-radius:6px;background:#1a1a1a;transition:.3s;min-width:105px;text-align:center}.item-box:hover{border-color:#e0b354;background:#2a2a2a;transform:translateY(-2px)}.term-box{color:#6ab0e3;border-color:#2a4d69;background:#1a1a2e}.place-box{color:#4cd1a3;border-color:#2d5c2d}.sela{color:#4cd1a3;font-weight:bold}.new{color:#6ab0e3;font-weight:bold}.record{margin:13px 0;padding:12px;border-left:3px solid #4cd1a3;background:#1a1a1a}.record b,.chat-sender{color:#e0b354;font-weight:bold}.chat-message{margin:8px 0;padding:8px;border-left:3px solid #4cd1a3;background:#2a2a2a}#examine-box{display:none;border:2px solid #a83232;padding:15px;background:#1a0000;border-radius:8px;min-height:150px}#box-content{display:flex;flex-wrap:wrap;gap:10px;min-height:50px;align-items:center}.empty-box{color:#666;font-style:italic}.item-in-box{color:#e0b354;padding:10px;border:1px solid #444;border-radius:6px;background:#2a2a2a;cursor:pointer}.box-counter,.small{color:#8a8a8a;font-size:.9rem}.action-btn{background:#2d5c7d;border-color:#3a7ca5}#restore-panel{display:none;padding:15px;border:1px solid #444;border-radius:6px;background:#1a1a1a}.restore-card{padding:13px;margin:10px 0;border:1px solid #444;border-radius:6px;background:#1a1a1a}.restore-card.done{border-color:#2d5c2d;background:#14251b}.restore-card b{color:#e0b354}.submit-btn{background:#2d5c2d}.case-note{margin:10px 0}.video{width:100%;border:1px solid #333;background:#000}#videoPanel{display:none}@media(max-width:900px){body{padding:10px}.container{grid-template-columns:1fr}#output{height:430px}.item-box{min-width:90px;flex:1}.toolbox button{flex:1}}</style></head><body><div class="container"><main class="game-area"><div id="output"></div><div class="panel"><h2>资料检索</h2><div class="small">格式：人物编号/地点编号，例如 A/R。未登记编号无法检索。</div><div class="toolbox"><input id="cmd" class="search-input" placeholder="输入人物编号/地点编号"><button onclick="run()">检索资料</button><button onclick="hint()">请求 SELA 提示</button></div><div class="toolbox"><button onclick="toggle('examine-box')">打开调查面板</button><button onclick="toggle('restore-panel')">打开案件推演</button></div></div><div id="examine-box"><h2>调查面板</h2><div id="box-content" class="empty-box">请从物品栏选择资料放入...</div><div id="box-counter" class="box-counter">已放置 0/3 个物品</div><div class="small">最多同时放入3项资料进行交叉调查。</div><div class="toolbox"><button class="action-btn" onclick="combine()">调查资料</button><button onclick="clearSel()">清空面板</button></div></div><div id="restore-panel"><h2>案件推演系统</h2><p class="small">资料满足关联条件后可建立推演。SELA仅处理已有信息。</p><div id="restoreBody"></div></div></main><aside class="sidebar"><section class="panel"><h2>人物档案</h2><div id="people" class="item-wrap"></div></section><section class="panel"><h2>地点记录</h2><div id="places" class="item-wrap"></div></section><section class="panel"><h2>物品栏</h2><div id="items" class="item-wrap"></div></section><section class="panel"><h2>已发现词条</h2><div id="terms" class="item-wrap"></div></section><section class="panel"><h2>案件概要</h2><p class="case-note">委托人：周夫妇</p><p class="case-note">失踪者：周扬名，男，6岁</p><p class="small">雨夜出了车祸。周夫妇被送去医院，等警方重新核对车里的人时，原本坐在后排的孩子不见了。</p></section><section class="panel" id="videoPanel"><h2>寻人启事录像</h2><video id="missingVideo" class="video" controls src="assets/missing-boy.mp4"></video><p class="small">后来公开过的一段寻人录像。</p></section></aside></div><script>const P={A:'周夫妇｜委托人',B:'侦探｜你',C:'陈国安｜警官',D:'林淑琴｜关联人物',E:'赵志强｜货车司机',F:'孙丽华｜急救护士',G:'吴建民｜店主',H:'郑凯｜出租车司机',I:'罗春梅｜居民',J:'周扬名｜失踪男童'},L={R:'Road｜青禾路',A:'Apartment｜周家',H:'Hospital｜市二院',B:'Bridge｜东渠桥',S:'Store｜建民小卖部',T:'Taxi Stand｜旧客运站',P:'Police｜城南派出所',G:'Gas Station｜南环加油站'};let st={p:new Set(['A','B','C']),l:new Set(['R','A']),t:new Set(),seen:new Set(),items:new Set(['事故现场照片','周扬名寻人启事']),sel:[],rest:new Set(),comb:new Set()};const out=document.getElementById('output');function log(x,c=''){out.insertAdjacentHTML('beforeend',`<div class="${c}">${x}</div>`);out.scrollTop=out.scrollHeight}function sela(x){log(`<span class="sela">SELA：</span>${x}`)}function rec(t,x){return `<div class="record"><b>${t}</b><div>${x}</div></div>`}function chat(t,a){return `<div class="record"><b>${t}</b>${a.map(x=>`<div class="chat-message"><span class="chat-sender">${x[0]}：</span>${x[1]}</div>`).join('')}</div>`}function term(x){if(!st.t.has(x)){st.t.add(x);if(x==='公开寻人时间'){document.getElementById('videoPanel').style.display='block';log('新增可读取资料：<b>寻人启事录像</b>','new');sela('检测到可关联的公开资料。已加入资料界面。')}render()}}function addItem(x,m=''){if(!st.items.has(x)){st.items.add(x);log(`获得资料：<b>${x}</b>`,'new');if(m)sela(m);render()}}function unlockP(x,m=''){if(!st.p.has(x)){st.p.add(x);log(`人物档案更新：<b>${x} ${P[x]}</b>`,'new');sela(m||'检测到新人物记录。已建立检索入口。');render()}}function unlockL(x,m=''){if(!st.l.has(x)){st.l.add(x);log(`地点记录更新：<b>${x} ${L[x]}</b>`,'new');sela(m||'检测到新地点记录。已加入可检索范围。');render()}}const R={'A/A':()=>{addItem('蓝色玩具汽车','物品已登记。当前关联度较低，保留待比对。');term('后排右座');return rec('周家｜再次询问','周明远：“他一直坐后排右边。出门的时候还在找那辆蓝色小汽车。”<br><br>周母：“那天我还催他把外套拉好。现在想起来，最后记得最清楚的反而就是这些小事。”<br><br>周明远：“先别想这些了。我们就是想知道，他后来到底去哪了。”')},'A/R':()=>{unlockP('F','证词涉及现场急救人员。已建立人物记录。');unlockL('H','检测到后续处置地点。已登记。');term('儿童哭声');return rec('青禾路｜周明远','“撞完以后我醒过一下。外面特别吵，雨也很大。”<br><br>“我听见扬名哭了一声，像是在喊我。我想回头，但根本动不了。”<br><br>“后面还有谁？我真记不起来了。”')},'C/R':()=>{unlockP('E','记录中出现未单独核查人员。已建立人物记录。');addItem('现场警戒记录');term('现场封锁');return rec('青禾路｜陈国安','陈国安：“我们21:31到的。那时候急救已经在忙了，外围也还没完全拦起来。”<br><br>“后排右门是开的。当年大家第一反应都是孩子受惊以后自己跑了，所以人手先往附近找。”<br><br>“现在再问我有没有人亲眼看见他自己走，我只能说：没有。”')},'C/P':()=>{addItem('首次搜寻范围图','资料已登记。搜索范围与现有路线信息可继续比对。');term('搜索方向偏差');return rec('城南派出所｜陈国安','“第一轮基本就在事故点周围找，沟里、路边、绿化带都翻过。”<br><br>“到22:06左右，医院那边才确认车里原本还有个六岁孩子。”<br><br>“二十多分钟，对一个自己走的小孩不算远。要是坐车，那就完全是另一回事了。”')},'F/H':()=>{addItem('急救出车单','资料已登记。存在可比对时间信息。');term('急救优先');return rec('市二院｜孙丽华','“两个大人伤得很重，我们那时候就是先救人。”<br><br>“我好像问过一句‘孩子谁抱着’，旁边有人回了句‘家里人’。谁说的，我现在真不敢认。”<br><br>“这么多年了，我偶尔也会想，当时要是再问一句会怎么样。”')},'F/R':()=>{term('儿童哭声');return rec('青禾路｜孙丽华','“小孩的哭声我听见过，就一下。”<br><br>“后排那边当时有好几个人，雨又大。我没看清是谁把孩子抱起来的。”<br><br>“没看清就是没看清，这个我不能乱补。”')},'E/R':()=>{unlockL('B','证词出现新的移动方向。已登记相关地点。');term('灰色外套');return rec('青禾路｜赵志强','“我就是路过，看撞得挺严重，就停下来搭把手。”<br><br>“后门边上有个穿灰外套的女的。我那时候真以为她是家里人，不然我肯定会多看两眼。”<br><br>“脸没看清，雨太大了。”')},'E/B':()=>{unlockP('I','证词中出现新的目击者。已建立人物记录。');return rec('东渠桥｜赵志强','“罗春梅那晚一直说，她看见有人抱着小孩往桥东边走。”<br><br>“我当时还觉得她看错了。那种雨，隔那么远，我自己都不敢说看得准。”')},'I/B':()=>{unlockP('G','证词涉及另一名现场附近人员。已登记。');unlockL('S','检测到路线中的新地点。已登记。');term('抱离');return rec('东渠桥｜罗春梅','“我可没说我看清脸了。我就看见一个穿灰衣服的女的抱着个孩子往桥东走。”<br><br>“那孩子头靠她肩上，不像自己在走。”<br><br>“那边当时还有家小卖部，老吴开的。你们要查就去问他。”')},'G/S':()=>{unlockP('H','记录涉及新的驾驶人员。已建立人物记录。');unlockL('T','检测到交通相关地点。已登记。');addItem('小卖部赊账纸');term('红色塑料袋');return rec('建民小卖部｜吴建民','“九点多吧，有个女的抱着个男孩进来。两个人都湿得厉害。”<br><br>“她买了毛巾和水，我顺手给了个红塑料袋。小孩没怎么说话，我就以为是吓到了。”<br><br>“后来老郑的车停门口。我当时真没觉得有什么不对。”')},'H/T':()=>{addItem('出租车调度抄件','资料已登记。检测到未闭合称谓。');term('未登记乘客');return chat('旧客运站｜残存调度记录',[['调度','你不是说那晚没拉人吗？'],['郑凯','不是那个。'],['调度','哪个？'],['郑凯','桥边那个女的。'],['调度','林姐？'],['郑凯','你别乱说，我没说名字。']])},'G/B':()=>{term('林淑琴');return chat('东渠桥｜补充询问',[['陈国安','以前桥东那个林淑琴，你认识吧？'],['吴建民','认识，后来早搬走了。'],['陈国安','出事那晚见过她没有？'],['吴建民','那个女的侧脸……有点像。'],['陈国安','只是像？'],['吴建民','对，只能说像。隔这么多年了，我哪敢说死。']])},'H/S':()=>{term('南环');return rec('建民小卖部｜郑凯','郑凯：“行，那晚我是拉过一个抱孩子的女的。”<br><br>“她说去南环，给的现金。路上基本没说话，小孩靠着她，看着像睡着了。”<br><br>“为什么没登记？那时候这种短单我嫌麻烦，就没写。”')},'D/T':()=>{unlockL('G','检测到路线数据可继续延伸。已登记相关地点。');addItem('异常里程记录');term('临时停车');return rec('旧客运站｜旧纸本','纸边上写着一个很潦草的“林淑琴”缩写。<br><br>郑凯那辆车从21:40到22:10多了大约8公里，但这一段没留下对应的乘客登记。')},'D/G':()=>{addItem('加油站旧账页','资料已登记。后续路线缺少可验证记录。');term('换乘可能');return rec('南环加油站｜旧账旁注','旧账边上有句话：“一女带一小孩借电话，后上一辆白色面包车。”<br><br>车牌只记了一部分，已经没法确认是哪辆车。<br><br>下面还有一行很淡的小字：“小孩一直没醒？”')},'J/R':()=>{term('事故后存活');return rec('周扬名｜现场记录整理','座位、哭声和后排留下的痕迹能互相对上。<br><br><span class="sela">SELA：</span>分析结果：事故发生后的短时间内，目标仍存在生命反应。')}};function run(){let q=cmd.value.trim().toUpperCase();cmd.value='';let z=q.split('/');if(z.length!==2)return sela('输入格式无法解析。请使用“人物编号/地点编号”。');let[p,l]=z;if(!st.p.has(p))return sela(`人物编号 ${p} 未登记。当前无法建立检索。`);if(!st.l.has(l))return sela(`地点编号 ${l} 未登记。当前无法建立检索。`);if(!R[q])return sela('未检测到该人物与地点之间的可读取记录。');let first=!st.seen.has(q);st.seen.add(q);log(R[q]());if(!first)sela('该记录已读取。重新读取未产生新增信息。');after();renderRestore()}function after(){if(st.seen.has('A/A')&&st.seen.has('A/R')&&st.seen.has('F/R'))unlockP('J','多项记录可对应同一儿童身份。已建立独立人物档案。');if(st.seen.has('H/T')&&st.seen.has('G/B'))unlockP('D','检测到重复姓名关联。身份对应关系尚未确认，已开放独立检索。');if(st.seen.has('C/R')&&st.seen.has('F/H'))unlockL('P','检测到现场处置与身份确认之间存在时间缺口。已开放相关记录检索。')}function pick(x){if(st.sel.includes(x))st.sel=st.sel.filter(v=>v!==x);else if(st.sel.length<3)st.sel.push(x);else return sela('调查面板容量已满。最大并行资料数：3。');render()}function clearSel(){st.sel=[];render()}function key(){return [...st.sel].sort().join('|')}const combos={'事故现场照片|现场警戒记录':()=>{term('后排车门');addItem('后排儿童鞋印照片');return '比对完成：后排右门曾打开，门外存在儿童鞋印。'},'急救出车单|现场警戒记录|周扬名寻人启事':()=>{term('身份确认空窗');return '比对完成：现场处置期间存在身份确认缺口。'},'后排儿童鞋印照片|蓝色玩具汽车':()=>{term('儿童曾离车');return '比对完成：儿童曾从后排右侧离开车厢。离开现场方式无法由该组资料确认。'},'出租车调度抄件|小卖部赊账纸':()=>{term('同一女性可能');return '时间记录存在重合。人物对应关系暂未确认。'},'出租车调度抄件|异常里程记录':()=>{term('南环路线吻合');return '里程数据与现有路线长度接近。'},'加油站旧账页|异常里程记录|周扬名寻人启事':()=>{term('二次转移');return '时间、年龄与路线存在连续性。后续车辆身份无法确认。'},'出租车调度抄件|异常里程记录|首次搜寻范围图':()=>{term('脱离搜索圈');return '车辆移动范围与第一轮搜索范围存在明显偏离。'},'周扬名寻人启事|首次搜寻范围图':()=>{term('公开寻人时间');return '检测到时间节点重合。存在可关联的公开资料。'}};function combine(){if(st.sel.length<2)return sela('资料数量不足。交叉分析至少需要2项输入。');let k=key(),f=combos[k];if(!f)return sela('当前资料组合未形成稳定关联。建议更换输入项。');if(st.comb.has(k))return sela('该组合已分析。当前结论无变化。');st.comb.add(k);sela(`<br><b>交叉分析完成</b><br>${f()}`);clearSel();renderRestore()}const rs=[['r1','推演01｜车内的孩子是谁',['A/A','A/R','F/R'],['后排右座','儿童哭声'],'A + F','座位和声音记录可以对应到周扬名。'],['r2','推演02｜事故后，他还活着吗',['J/R'],['事故后存活'],'A + F + J','事故发生后的短时间内，周扬名仍有生命反应。'],['r3','推演03｜后排右门发生了什么',['C/R'],['后排车门','儿童曾离车'],'C + 现场物证','孩子离开过后排，但现有资料看不出他是怎么离开现场的。'],['r4','推演04｜谁在看着那个孩子',['C/R','F/H','E/R'],['现场封锁','急救优先','身份确认空窗'],'C + E + F','救人的那段时间里，孩子由谁照看这件事没有被真正确认。'],['r5','推演05｜灰衣女性的移动路线',['E/B','I/B','G/S'],['灰色外套','抱离'],'E + G + I','几段目击能从事故点附近接到桥东的小卖部。'],['r6','推演06｜小卖部以后',['G/S','H/T','H/S'],['未登记乘客','南环','同一女性可能'],'G + H','小卖部之后，两人可能坐出租车去了南环。'],['r7','推演07｜“林姐”是谁',['H/T','G/B','D/T'],['林淑琴','临时停车'],'D + G + H','“林姐”和林淑琴之间存在多处对应，但身份仍无法完全确认。'],['r8','推演08｜为什么没找到',['C/P','H/S'],['搜索方向偏差','南环路线吻合','脱离搜索圈'],'C + H','警方在附近找人的时候，孩子可能已经坐车离开了。'],['r9','推演09｜南环是终点吗',['D/G'],['换乘可能','二次转移'],'D + 南环资料','南环之后还有一次可能的换车，路线从这里断掉。'],['r10','最终推演｜周扬名去了哪里',['D/G','J/R'],['事故后存活','身份确认空窗','抱离','南环路线吻合','二次转移'],'全部证词','目前只能追到第二次转移。之后去了哪里，没有记录。']];function can(r){return r[2].every(x=>st.seen.has(x))&&r[3].every(x=>st.t.has(x))}function restoreOne(id){let r=rs.find(x=>x[0]===id);if(!can(r))return sela('推演条件未满足。缺失项类型：证词或关联词条。');st.rest.add(id);log(`<div class="record"><b>${r[1]}｜推演成立</b><br>${r[5]}</div>`);if(id==='r2')sela('推演成立。事故时间点与失踪时间点不重合。');else if(id==='r7')sela('推演成立。当前仅确认关联，不执行身份等同。');else if(id==='r10')sela('推演结束。现有数据无法继续延伸路线。');renderRestore()}function renderRestore(){restoreBody.innerHTML=rs.map(r=>`<div class="restore-card ${st.rest.has(r[0])?'done':''}"><b>${r[1]}</b><div class="small">交叉人物：${r[4]}</div><p>${st.rest.has(r[0])?'已完成':can(r)?'推演条件已满足。':'条件不足。'}</p>${!st.rest.has(r[0])?`<button onclick="restoreOne('${r[0]}')">开始推演</button>`:''}</div>`).join('')+(rs.every(r=>st.rest.has(r[0]))?'<div class="restore-card done"><b>SELA：案件模型已完成</b><p>现有资料已完成整合。未检测到可继续验证的路线数据。</p><button class="submit-btn" onclick="finish()">生成最终案件报告</button></div>':'')}function finish(){localStorage.setItem('lost_memory_complete','1');location.href='ending.html'}function hint(){let unread=[...Object.keys(R)].filter(q=>!st.seen.has(q)&&st.p.has(q[0])&&st.l.has(q[2]));let missingCombo=Object.keys(combos).some(k=>!st.comb.has(k)&&k.split('|').every(x=>st.items.has(x)));let msgs=[];if(unread.length)msgs.push('检测到尚未完成验证的人物记录。','现有调查网络存在未读取节点。','部分已登记信息尚未进行交叉验证。');if(missingCombo)msgs.push('当前资料库存在可比较项。建议执行交叉分析。','单项资料未发现新增异常。建议检查资料之间的关联。');if(st.t.has('林淑琴')&&!st.p.has('D'))msgs.push('检测到重复出现的身份信息。对应关系尚未完成验证。');if(st.t.has('南环')&&!st.l.has('G'))msgs.push('当前移动路线存在未闭合区段。建议继续进行路线分析。');if(!msgs.length)msgs.push('当前可读取记录增量较低。建议检查未完成的案件推演。','现有数据未发现新的直接检索入口。建议重新检查关联项。');sela(msgs[Math.floor(Math.random()*msgs.length)])}function toggle(id){let e=document.getElementById(id);e.style.display=e.style.display==='block'?'none':'block'}function render(){people.innerHTML=[...st.p].sort().map(x=>`<div class="item-box">${x}<br><span class="small">${P[x]}</span></div>`).join('');places.innerHTML=[...st.l].map(x=>`<div class="item-box place-box">${x}<br><span class="small">${L[x]}</span></div>`).join('');items.innerHTML=[...st.items].map(x=>`<div onclick="pick('${x}')" class="item-box ${st.sel.includes(x)?'term-box':''}">${x}</div>`).join('');terms.innerHTML=[...st.t].map(x=>`<div class="item-box term-box">${x}</div>`).join('')||'<span class="empty-box">尚未发现词条</span>';document.getElementById('box-content').innerHTML=st.sel.length?st.sel.map(x=>`<div class="item-in-box" onclick="pick('${x}')">${x}</div>`).join(''):'请从物品栏选择资料放入...';document.getElementById('box-counter').textContent=`已放置 ${st.sel.length}/3 个物品`}cmd.addEventListener('keydown',e=>{if(e.key==='Enter')run()});missingVideo.addEventListener('ended',()=>{addItem('寻人启事录像记录','录像读取完成。公开资料已归档。')});render();renderRestore();sela('连接完成。你好，我是你的私人调查助手 SELA。');sela('人物、地点、证词与物证索引已载入。我会执行记录、比对与异常提示。');log('<div class="record"><b>新的委托</b><br>周夫妇想重新查一遍儿子周扬名当年的失踪。那场车祸以后，两个人被送去了医院，孩子却没找到。警方后来把案子列成了长期失踪。<br><br>这次要查的只有一件事：<b>事故以后，他去了哪里？</b></div>');sela('当前可检索人物：A、B、C。当前可检索地点：R、A。请输入“人物编号/地点编号”开始检索。');</script></body></html>
