<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOST MEMORY｜周扬名失踪案</title><style>*{box-sizing:border-box}body{margin:0;background:#090b0d;color:#d9dde1;font:14px/1.65 Consolas,"Microsoft YaHei",sans-serif}.wrap{max-width:1250px;margin:auto;padding:16px;display:grid;grid-template-columns:1fr 350px;gap:15px}header{grid-column:1/-1;border-bottom:1px solid #30363d;padding:8px 0 14px}h1{margin:0;color:#d5ad5b;letter-spacing:3px}.sub,.small{color:#818a92;font-size:12px}.box{background:#101418;border:1px solid #2b3137;border-radius:5px;padding:13px;margin-bottom:13px}#out{height:450px;overflow:auto}.sela{color:#59d3aa}.sys{color:#e8a66a}.new{color:#71aee8}.warn{color:#e27676}.rec{border-left:3px solid #3f596d;background:#151b20;padding:10px;margin:9px 0}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}input,select,button{background:#181d22;color:#ddd;border:1px solid #3b434b;padding:8px;border-radius:3px}input{flex:1;min-width:150px}button{cursor:pointer}.tag{display:inline-block;border:1px solid #3d566b;color:#8ec5ef;padding:4px 7px;margin:3px;border-radius:3px}.person{border-color:#5b4d2e;color:#e2c477}.item{border-color:#4e5d3d;color:#bad18d;cursor:pointer}.selected{background:#334027}.locked{color:#555}.panel{display:none}.restoreCard{border:1px solid #343b42;padding:10px;margin:8px 0}.done{border-color:#4f806c}.chat{background:#111820;padding:9px;margin-top:7px}.who{color:#e2c477}@media(max-width:850px){.wrap{grid-template-columns:1fr}#out{height:400px}}</style></head><body><div class="wrap"><header><h1>LOST MEMORY</h1><div class="sub">CASE 00｜周扬名失踪案｜SELA Investigation System</div></header><main><div class="box" id="out"></div><div class="box"><b>资料检索</b><div class="small">typehelp 查看规则｜格式：人物/地点</div><div class="controls"><input id="cmd" placeholder="A/R"><button onclick="run()">检索</button><button onclick="hint()">SELA提示</button><button onclick="show('lab')">调查面板</button><button onclick="show('restore')">证词还原</button></div></div><div class="box panel" id="lab"><b>调查面板</b><p class="small">从右侧物品栏选择最多3项，再进行组合调查。无意义的组合不会产生新线索。</p><div id="slots"></div><div class="controls"><button onclick="combine()">分析所选项目</button><button onclick="clearSel()">清空</button></div></div><div class="box panel" id="restore"><b>多人证词还原</b><div id="restoreBody"></div></div><div class="box"><b>词条库</b><div id="terms"></div></div></main><aside><div class="box"><b>人物档案</b><div id="people"></div></div><div class="box"><b>地点</b><div id="places"></div></div><div class="box"><b>物品 / 资料</b><div id="items"></div></div><div class="box"><b>案件概要</b><p>委托方：周夫妇</p><p>失踪者：周扬名，男，6岁</p><p class="small">雨夜车辆撞击护栏。父母重伤获救，后排男童随后失踪。</p></div><div class="box"><b>寻人启事录像</b><video controls style="width:100%" src="assets/missing-boy.mp4"></video><div class="small">文件路径：assets/missing-boy.mp4</div></div></aside></div><script>
const P={A:'周明远｜父亲',B:'侦探｜玩家',C:'陈国安｜警官',D:'林淑琴｜待核身份',E:'赵志强｜货车司机',F:'孙丽华｜急救护士',G:'吴建民｜店主',H:'郑凯｜出租车司机',I:'罗春梅｜居民',J:'周扬名｜失踪男童'};
const L={R:'Road｜青禾路',A:'Apartment｜周家',H:'Hospital｜市二院',B:'Bridge｜东渠桥',S:'Store｜建民小卖部',T:'Taxi Stand｜旧客运站',P:'Police｜城南派出所',G:'Gas Station｜南环加油站'};
let st={p:new Set(['A','B','C']),l:new Set(['R','A']),t:new Set(),seen:new Set(),items:new Set(['事故现场照片','周扬名寻人启事']),sel:[],rest:new Set(),comb:new Set()};
function rec(t,x){return `<div class="rec"><b>${t}</b><div>${x.replace(/\n/g,'<br>')}</div></div>`}function chat(t,lines){return `<div class="rec"><b>${t}</b><div class="chat">${lines.map(x=>`<div><span class="who">${x[0]}：</span>${x[1]}</div>`).join('')}</div></div>`}
const R={
'A/A':()=>{addItem('蓝色玩具汽车');term('后排右座');return rec('周明远补充陈述','“扬名坐后排右边。他出门前还找那辆蓝色玩具汽车。醒来以后，他们跟我说车里没有孩子。”')},
'A/R':()=>{unlockP('F');unlockL('H');term('儿童哭声');return rec('周明远事故记忆','“撞上以后我醒过一小会儿。我听见扬名哭，喊了一声爸爸。后来有个女急救员在问话，再后面我就没印象了。”')},
'C/R':()=>{unlockP('E');addItem('现场警戒记录');term('现场封锁');return rec('陈国安现场笔录','21:24接警，21:31抵达。救护人员已经开始处置伤者，外围警戒尚未完成。赵志强在路肩协助。后排右门开启。')},
'F/H':()=>{addItem('急救出车单');term('急救优先');return rec('孙丽华救护记录','21:23抵达。两名成年人均需优先处置。后排门已开。“我问孩子是谁抱着，旁边有人说家里人，我就继续抢救。”')},
'F/R':()=>{term('儿童哭声');return rec('孙丽华现场回忆','“我听到过一次小孩哭，很短。当时后排旁边有两三个路人。我没看清是谁把孩子抱起来的。”')},
'E/R':()=>{unlockL('B');term('灰色外套');return rec('赵志强第一次证词','“我大概21:17到。后门边有个穿灰外套的女人，我以为是家属。后来我把车挪到桥边。”')},
'E/B':()=>{unlockP('I');return rec('赵志强补充证词','“罗春梅一直说看见有人抱孩子。我觉得她可能看错了，那晚雨很大。”')},
'I/B':()=>{unlockP('G');unlockL('S');term('抱离');return rec('罗春梅证词','“我看见灰衣女人抱着孩子往桥东走。孩子头靠在她肩上。小卖部老吴那晚还开着。”')},
'G/S':()=>{unlockP('H');unlockL('T');addItem('小卖部赊账纸');term('红色塑料袋');return rec('吴建民口述','“九点多一个女的抱着男孩进来买水和毛巾，拿红塑料袋。后来老郑的出租车停门口。我以为是母子。”')},
'H/T':()=>{addItem('出租车调度抄件');term('未登记乘客');return chat('郑凯与调度员旧聊天',[['调度','你不是说那晚没拉人吗？'],['郑凯','不是那个。'],['调度','哪个？'],['郑凯','桥边那个女的。'],['调度','林姐？'],['郑凯','你别乱说，我没说名字。']])},
'G/B':()=>{term('林淑琴');return chat('吴建民后续聊天',[['陈国安','你认识以前住桥东的林淑琴？'],['吴建民','认识。林家早搬了。'],['陈国安','事故晚上见过她吗？'],['吴建民','那个女的侧脸有点像她……但我不敢认。']])},
'H/S':()=>{term('南环');return rec('郑凯第二次陈述','“有个女的抱孩子敲车窗，说去南环。现金。她在加油站附近下车。具体几点我记不住。”')},
'D/T':()=>{unlockL('G');addItem('异常里程记录');term('临时停车');return rec('旧客运站排查资料','纸本出现“林淑琴”姓名缩写。郑凯车辆21:40—22:10里程增加约8公里，该乘客未登记。')},
'D/G':()=>{addItem('加油站旧账页');term('换乘可能');return rec('南环加油站旧账旁注','值班员写有：“一女带一小孩借电话，后上一辆白色面包车。”车牌未记全，身份无法确认。')},
'J/R':()=>{term('事故后存活');return rec('周扬名现场身份资料','家属记忆、急救人员听到的儿童哭声、后排座位痕迹互相支持：事故发生后周扬名仍具有生命反应。')}
};
function log(x,c=''){out.insertAdjacentHTML('beforeend',`<div class="${c}">${x}</div>`);out.scrollTop=out.scrollHeight}function term(x){if(!st.t.has(x)){st.t.add(x);render()}}function addItem(x){if(!st.items.has(x)){st.items.add(x);log(`SELA：新调查资料加入物品栏：<b>${x}</b>`,'new');render()}}function unlockP(x){if(!st.p.has(x)){st.p.add(x);log(`SELA：记录正文确认新人物：<b>${x} — ${P[x]}</b>`,'new');render()}}function unlockL(x){if(!st.l.has(x)){st.l.add(x);log(`SELA：地点登记：<b>${x} — ${L[x]}</b>`,'new');render()}}
function run(){let q=cmd.value.trim().toUpperCase();cmd.value='';if(q==='TYPEHELP')return help();let z=q.split('/');if(z.length!==2)return log('SELA：格式错误。输入 typehelp。','sela');let[p,l]=z;if(!st.p.has(p))return log(`SELA：人物 ${p} 尚未从记录中解锁。`,'sela');if(!st.l.has(l))return log(`SELA：地点 ${l} 尚未开放。`,'sela');if(!R[q])return log(`SELA：${q} 没有可用记录。`,'sela');st.seen.add(q);log(R[q]());after(q);renderRestore()}
function after(q){if(st.seen.has('A/A')&&st.seen.has('A/R')&&st.seen.has('F/R'))unlockP('J');if(st.seen.has('H/T')&&st.seen.has('G/B')&&!st.p.has('D')){unlockP('D');log('SELA：两个独立来源中的“林姐”与“林淑琴”达到建立关联档案的最低条件。','warn')}if(st.seen.has('C/R')&&st.seen.has('F/H'))unlockL('P')}
function help(){log(rec('TYPEHELP','检索格式：人物编号/地点编号，例如 A/R。<br>开局地点只有 R=Road、A=Apartment。<br>新人物只有在你真正阅读到提及其姓名或可确认身份的记录后才会解锁。<br>物品栏最多选择3项进行组合分析。<br>多人证词还原需要先读完对应人物记录。<br>D为隐藏人物。最终任务是分析周扬名的去向，而不是选择“凶手”。'))}
function pick(x){if(st.sel.includes(x))st.sel=st.sel.filter(v=>v!==x);else if(st.sel.length<3)st.sel.push(x);else return log('SELA：调查面板一次最多放入3项。','sela');render()}function clearSel(){st.sel=[];render()}function key(){return [...st.sel].sort().join('|')}
const combos={
'事故现场照片|现场警戒记录':()=>{term('后排车门');addItem('后排儿童鞋印照片');return '照片与警戒记录确认：后排右门并非撞击自动弹开，而是在救援开始前后被人为打开。'},
'急救出车单|现场警戒记录|周扬名寻人启事':()=>{term('身份确认空窗');return '救护抵达早于完整警戒；当时成年人伤势严重，儿童身份尚未由清醒家属确认。存在短暂身份确认空窗。'},
'后排儿童鞋印照片|蓝色玩具汽车':()=>{term('儿童曾离车');return '鞋印位置由后排右侧延伸至车外泥水区，支持儿童在事故后曾离开座位，但不能单独证明是自行离开。'},
'出租车调度抄件|小卖部赊账纸':()=>{term('同一女性可能');return '小卖部时间窗口与出租车未登记行程能够衔接；两份资料可能描述同一名抱儿童女性。'},
'出租车调度抄件|异常里程记录':()=>{term('南环路线吻合');return '异常里程与旧客运站至南环往返/单程组合高度吻合，郑凯“没有载客”的最初说法不可信。'},
'加油站旧账页|异常里程记录|周扬名寻人启事':()=>{term('二次转移');return '年龄描述、时间窗口和下车地点均可衔接，但无法确认白色面包车及后续目的地。最稳妥结论是“存在二次转移可能”。'}
};
function combine(){if(st.sel.length<2)return log('SELA：至少选择2项资料。','sela');let k=key(),f=combos[k];if(!f)return log('SELA：这组资料暂时无法建立可靠关联。','sela');if(st.comb.has(k))return log('SELA：该组合已经分析过。','sela');st.comb.add(k);log(`<b>SELA组合分析：</b>${f()}`,'sela');clearSel();renderRestore()}
const restores=[{id:'r1',title:'还原01｜事故后，周扬名是否仍在现场？',need:['A/R','F/R','J/R'],terms:['儿童哭声','事故后存活'],people:'A + F + J',text:'父亲与急救人员分别听到儿童哭声，身份链又将声音与后排男童对应。周扬名事故后仍有生命反应。'}, {id:'r2',title:'还原02｜现场七分钟空窗',need:['C/R','F/H','E/R'],terms:['现场封锁','急救优先','身份确认空窗'],people:'C + E + F',text:'警方外围尚未完成、救护优先成年人、路人把灰衣女性误当家属。现场形成身份确认空窗。'}, {id:'r3',title:'还原03｜男童如何离开核心现场',need:['E/B','I/B','G/S'],terms:['抱离','灰色外套'],people:'E + G + I',text:'赵志强只能确认灰衣女性；罗春梅目击抱离；吴建民在桥东小卖部再次见到一女抱男孩。三证词构成连续路线。'}, {id:'r4',title:'还原04｜桥东之后',need:['G/S','H/T','H/S'],terms:['未登记乘客','南环'],people:'G + H',text:'小卖部目击与郑凯未登记载客记录衔接，男童最可能乘出租车离开步行搜索范围。'}, {id:'r5',title:'隐藏还原｜“林姐”是谁',need:['H/T','G/B','D/T'],terms:['林淑琴','临时停车'],people:'D + G + H',text:'两个独立来源把“林姐”与林淑琴联系起来，调度纸本进一步提供姓名缩写，但仍不足以单独认定犯罪。'}, {id:'r6',title:'隐藏还原｜南环之后',need:['D/G'],terms:['换乘可能','二次转移'],people:'D + H',text:'出租车路线终点与加油站记录相接。女性与儿童可能换乘白色面包车，此后现有资料中断。'}];
function can(r){return r.need.every(x=>st.seen.has(x))&&r.terms.every(x=>st.t.has(x))}function restoreOne(id){let r=restores.find(x=>x.id===id);if(!can(r))return log('SELA：证词或词条不足，无法还原。','sela');st.rest.add(id);log(`<b>${r.title} 完成</b><br>${r.text}`,'sys');renderRestore()}
function renderRestore(){restoreBody.innerHTML=restores.map(r=>`<div class="restoreCard ${st.rest.has(r.id)?'done':''}"><b>${r.title}</b><div class="small">涉及人物：${r.people}</div><div class="small">状态：${st.rest.has(r.id)?'已完成':can(r)?'可以还原':'资料不足'}</div>${!st.rest.has(r.id)?`<button onclick="restoreOne('${r.id}')">进行还原</button>`:''}</div>`).join('')+`<div class="restoreCard"><b>最终｜周扬名去向提交</b><div class="small">完成前4项主要还原后开放。</div>${['r1','r2','r3','r4'].every(x=>st.rest.has(x))?'<button onclick="finalSubmit()">提交去向分析</button>':''}</div>`}
function finalSubmit(){let hidden=['r5','r6'].every(x=>st.rest.has(x));if(hidden)log('<b>案件分析完成｜隐藏路线</b><br>周扬名在事故后仍存活。救援初期的身份确认空窗使一名成年人能够将其抱离，经东渠桥、小卖部、郑凯出租车抵达南环。隐藏资料进一步支持林淑琴与该女性存在关联，并显示儿童可能在南环再次换乘白色面包车。此后去向无法确认。<br><br><span class="warn">SELA：不要把“最合理模型”写成“已证实事实”。本案仍应维持失踪状态。多年后的非案件资料中，出现过与该儿童旧物描述相似的记录。</span>','sys');else log('<b>案件分析完成</b><br>周扬名事故后仍有生命反应，并非单纯自行走失。现有证词最支持其被成年人抱离现场，经桥东方向及出租车离开警方最初搜索区域。南环之后资料不足。<br>案件状态：长期失踪。','sys')}
function hint(){let order=['A/A','A/R','C/R','F/H','F/R','E/R','E/B','I/B','G/S','H/T','G/B','H/S','J/R','D/T','D/G'];let n=order.find(q=>!st.seen.has(q)&&st.p.has(q[0])&&st.l.has(q[2]));log(n?`SELA：当前建议检查 <b>${n}</b>。这不代表该人物具有嫌疑。`:'SELA：可检索主资料接近完成。检查调查面板和证词还原。','sela')}
function show(x){document.getElementById(x).style.display=document.getElementById(x).style.display==='block'?'none':'block'}function render(){people.innerHTML=[...st.p].sort().map(x=>`<span class="tag person">${x} ${P[x]}</span>`).join('');places.innerHTML=[...st.l].map(x=>`<span class="tag">${x} ${L[x]}</span>`).join('');terms.innerHTML=[...st.t].map(x=>`<span class="tag">${x}</span>`).join('')||'<span class="locked">尚无</span>';items.innerHTML=[...st.items].map(x=>`<span onclick="pick('${x}')" class="tag item ${st.sel.includes(x)?'selected':''}">${x}</span>`).join('');slots.innerHTML=st.sel.length?st.sel.map(x=>`<span class="tag item selected">${x}</span>`).join(''):'<span class="locked">未选择资料</span>'}cmd.addEventListener('keydown',e=>{if(e.key==='Enter')run()});render();renderRestore();log('<span class="sela">SELA：</span>调查终端已连接。周夫妇委托重新调查周扬名失踪案。');log('初始人物：A 周明远 / B 侦探 / C 陈国安<br>限定地点：R — Road / A — Apartment<br>输入 <b>typehelp</b> 查看调查规则。','sys');</script></body></html>
